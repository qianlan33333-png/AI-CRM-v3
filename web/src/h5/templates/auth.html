<div style="position:relative;display:flex;align-items:center;justify-content:center;height:44px;background:#fff;border-bottom:1px solid #EDEEF0;flex:none">
          <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#1F2329" stroke-width="1.6" style="position:absolute;left:14px"><path d="M9.6 3.6L5.2 8l4.4 4.4"/></svg>
          <span style="font-size:16px;font-weight:600">增长诊断测评</span>
          <span style="position:absolute;right:16px;letter-spacing:1px;color:#1F2329">···</span>
        </div>
        <div data-h5-blocked role="status" style="padding:9px 14px;border-bottom:1px solid #FFE0B2;background:#FFF7E8;color:#8A4B08;font-size:12px;line-height:18px">{{ blockedReason }}</div>
        <div style="flex:1;min-height:0;overflow:auto;background:#F5F6F7;display:flex;align-items:center;padding:0 20px">
          <div style="width:100%;background:#fff;border-radius:16px;padding:32px 24px;text-align:center;box-shadow:0 2px 12px rgba(31,35,41,.05)">
            <span style="display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:999px;background:#EFF4FF;color:var(--accent,#3370ff);font-size:13px;font-weight:600">微信身份验证</span>
            <h1 style="margin:18px 0 0;font-size:26px;line-height:34px;font-weight:600;letter-spacing:-.01em">完成微信授权后填写</h1>
            <p style="margin:12px 0 0;font-size:14px;line-height:22px;color:#8F959E">验证 UnionID 后才可填写并提交问卷。授权成功后会自动返回当前问卷。</p>
            <button disabled aria-disabled="true" onClick="{{ act.authContinue }}" style="width:100%;height:48px;margin-top:26px;border:0;border-radius:12px;background:var(--accent,#3370ff);color:#fff;font-size:16px;font-weight:600;cursor:pointer">微信授权后继续</button>
            <sc-if value="{{ notWechatUA }}"><div style="display:flex;gap:8px;align-items:flex-start;margin-top:18px;padding:12px 14px;border-radius:10px;background:#FFF7E8;text-align:left">
              <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#D97917" stroke-width="1.5" style="flex:none;margin-top:2px"><circle cx="8" cy="8" r="6"/><path d="M8 4.8v4M8 10.6v.6"/></svg>
              <span style="font-size:13px;line-height:20px;color:#D97917">当前不在微信内打开，请复制链接到微信中继续。</span>
            </div></sc-if>
          </div>
