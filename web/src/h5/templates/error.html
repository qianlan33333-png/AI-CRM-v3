<div style="position:relative;display:flex;align-items:center;justify-content:center;height:44px;background:#fff;border-bottom:1px solid #EDEEF0;flex:none">
          <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#1F2329" stroke-width="1.6" style="position:absolute;left:14px"><path d="M9.6 3.6L5.2 8l4.4 4.4"/></svg>
          <span style="font-size:16px;font-weight:600">增长诊断测评</span>
          <span style="position:absolute;right:16px;letter-spacing:1px;color:#1F2329">···</span>
        </div>
        <div data-h5-blocked role="status" style="padding:9px 14px;border-bottom:1px solid #FFE0B2;background:#FFF7E8;color:#8A4B08;font-size:12px;line-height:18px">{{ blockedReason }}</div>
        <div style="flex:1;min-height:0;overflow:auto;background:#F5F6F7;padding:14px">
          <sc-if value="{{ error }}">
            <div style="background:#fff;border-radius:14px;padding:22px 18px;text-align:center">
              <svg width="36" height="36" viewBox="0 0 16 16" fill="none" stroke="#D83931" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><path d="M8 4.8v4M8 10.6v.6"/></svg>
              <h1 style="margin:14px 0 6px;font-size:20px">页面加载失败</h1>
              <p data-h5-error role="alert" style="margin:0;font-size:14px;line-height:22px;color:#D83931">{{ error }}</p>
              <sc-if value="{{ canRetry }}"><a role="button" onClick="{{ act.retry }}" style="display:block;box-sizing:border-box;width:100%;height:48px;line-height:48px;margin-top:20px;border:0;border-radius:12px;background:var(--accent,#3370ff);color:#fff;font-size:16px;font-weight:600;cursor:pointer">重试</a></sc-if>
            </div>
          </sc-if>
          <sc-if value="{{ errorEmpty }}">
            <div style="background:#fff;border-radius:14px;padding:22px 18px;text-align:center">
              <svg width="36" height="36" viewBox="0 0 16 16" fill="none" stroke="#D83931" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><path d="M8 4.8v4M8 10.6v.6"/></svg>
              <h1 style="margin:14px 0 6px;font-size:20px">当前页面不可执行</h1>
              <p style="margin:0;font-size:14px;line-height:22px;color:#8F959E">没有等价的后端页面状态或提交上下文；未读取演示题目，也未发送请求。</p>
              <button disabled aria-disabled="true" style="width:100%;height:48px;margin-top:20px;border:0;border-radius:12px;background:#A8C3FF;color:#fff;font-size:16px;font-weight:600">暂不可重试</button>
            </div>
          </sc-if>
        </div>
