<div style="position:relative;display:flex;align-items:center;justify-content:center;height:44px;background:#fff;border-bottom:1px solid #EDEEF0;flex:none">
  <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#1F2329" stroke-width="1.6" style="position:absolute;left:14px"><path d="M9.6 3.6L5.2 8l4.4 4.4"/></svg>
  <span style="font-size:16px;font-weight:600">增长诊断测评</span><span style="position:absolute;right:16px;letter-spacing:1px;color:#1F2329">···</span>
</div>
<div style="flex:1;min-height:0;display:flex;flex-direction:column;background:#F5F6F7">
  <div style="flex:1;min-height:0;overflow:auto;padding:16px 14px">
    <sc-if value="{{ loading }}"><div role="status" style="background:#fff;border-radius:14px;padding:18px;color:#646A73">正在读取真实问卷…</div></sc-if>
    <sc-if value="{{ error }}"><div role="alert" data-h5-error style="background:#FDECEE;border-radius:12px;padding:14px;color:#D83931">{{ error }}<sc-if value="{{ canRetry }}"><button onClick="{{ act.retry }}" style="display:block;margin-top:10px">重试读取</button></sc-if></div></sc-if>
    <sc-if value="{{ ready }}">
      <div style="background:#fff;border-radius:14px;padding:16px">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px"><span style="font-size:13px;color:#8F959E;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ title }}</span><span data-h5-progress style="font-size:13px;font-weight:600;color:var(--accent,#3370ff);white-space:nowrap">{{ qProgressText }}</span></div>
        <div style="height:6px;border-radius:999px;background:#EBEDF0;overflow:hidden"><div style="width:{{ qPct }}%;height:100%;border-radius:999px;background:var(--accent,#3370ff)"></div></div>
        <div style="margin-top:20px;font-size:19px;line-height:28px;font-weight:600">{{ qTitle }}</div>
        <sc-for list="{{ questions }}" as="question"><sc-if value="{{ question.supported }}"><div data-question-id="{{ question.id }}"><div style="font-size:13px;color:#A6AAB0;margin-top:6px">{{ question.hint }}</div><div style="margin-top:16px"><sc-if value="{{ question.isChoice }}"><sc-for list="{{ question.options }}" as="option"><label data-option-id="{{ option.id }}" aria-pressed="{{ option.selected }}" onClick="{{ option.pick }}" style="display:flex;align-items:flex-start;gap:10px;padding:13px 14px;margin-bottom:10px;border-radius:12px;cursor:pointer;{{ option.style }}"><span>{{ option.mark }}</span><span style="font-size:15px;line-height:22px">{{ option.text }}</span></label></sc-for></sc-if><sc-if value="{{ question.isTextarea }}"><textarea data-text-question-id="{{ question.id }}" placeholder="{{ question.placeholder }}" onInput="{{ question.input }}" style="box-sizing:border-box;width:100%;min-height:112px;border:1px solid #DEE0E3;border-radius:10px;padding:12px;font-size:15px;resize:vertical">{{ question.inputValue }}</textarea></sc-if><sc-if value="{{ question.isMobile }}"><input data-text-question-id="{{ question.id }}" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="11" pattern="1[3-9][0-9]{9}" value="{{ question.inputValue }}" placeholder="{{ question.placeholder }}" onInput="{{ question.input }}" style="box-sizing:border-box;width:100%;height:48px;border:1px solid #DEE0E3;border-radius:10px;padding:0 12px;font-size:16px"></sc-if></div></div></sc-if><sc-if value="{{ question.unsupported }}"><div data-h5-unsupported style="opacity:.6"><div style="font-size:13px;color:#A6AAB0;margin-top:6px">{{ question.hint }}</div><div style="height:44px;margin-top:16px;border-radius:10px;background:#F2F3F5;display:flex;align-items:center;justify-content:center;color:#A6AAB0;font-size:13px">暂不可作答</div></div></sc-if></sc-for>
        <p style="margin:18px 0 0;font-size:13px;line-height:20px;color:#A6AAB0;text-align:center">作答后点击「下一题」继续，可随时返回「上一题」修改；最后一题点击「提交」。</p>
      </div>
    </sc-if>
    <sc-if value="{{ submitted }}"><div data-h5-receipt style="background:#fff;border-radius:14px;padding:18px"><h2 style="margin:0;font-size:18px">已收到本地提交回执</h2><p style="font-size:13px;color:#646A73">未执行任何外部效果。</p><a data-h5-result-link href="{{ resultPath }}" style="color:#245BDB">查询真实提交结果</a></div></sc-if>
  </div>
  <sc-if value="{{ ready }}"><div style="flex:none;display:flex;gap:10px;padding:14px 14px 22px;background:#fff;border-top:1px solid #EDEEF0"><sc-if value="{{ canPrevious }}"><button data-h5-previous onClick="{{ act.prevQ }}" style="flex:.8;height:48px;border:1px solid #DEE0E3;border-radius:12px;background:#fff;font-size:16px;font-weight:600;color:#1F2329;cursor:pointer">上一题</button></sc-if><sc-if value="{{ canNext }}"><button data-h5-next onClick="{{ act.nextQ }}" style="flex:1.2;height:48px;border:0;border-radius:12px;background:var(--accent,#3370ff);color:#fff;font-size:16px;font-weight:600;cursor:pointer">下一题</button></sc-if><sc-if value="{{ canSubmit }}"><button data-h5-submit onClick="{{ act.submit }}" style="flex:1.2;height:48px;border:0;border-radius:12px;background:var(--accent,#3370ff);color:#fff;font-size:16px;font-weight:600;cursor:pointer">提交</button></sc-if></div></sc-if>
</div>
