<div style="position:relative;display:flex;align-items:center;justify-content:center;height:44px;background:#fff;border-bottom:1px solid #EDEEF0;flex:none">
          <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#1F2329" stroke-width="1.6" style="position:absolute;left:14px"><path d="M9.6 3.6L5.2 8l4.4 4.4"/></svg>
          <span style="font-size:16px;font-weight:600">确认订单</span>
          <span style="position:absolute;right:16px;letter-spacing:1px;color:#1F2329">···</span>
        </div>
        <div data-h5-blocked role="status" style="padding:9px 14px;border-bottom:1px solid #FFE0B2;background:#FFF7E8;color:#8A4B08;font-size:12px;line-height:18px">{{ blockedReason }}</div>
        <div style="flex:1;min-height:0;overflow:auto;background:#F5F6F7;padding:14px">
          <div style="background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;display:flex;gap:12px">
            <div style="width:64px;height:64px;border-radius:10px;background:linear-gradient(135deg,#DCE7FF,#B9CDFF);flex:none"></div>
            <div style="min-width:0;flex:1">
              <div style="font-size:15px;font-weight:600">商品信息未提供</div>
              <div style="font-size:13px;color:#8F959E;margin-top:4px">缺少支付订单、价格与权益契约</div>
              <div style="font-size:16px;font-weight:600;margin-top:8px">不可结算</div>
            </div>
          </div>
          <div style="background:#fff;border-radius:14px;padding:4px 16px;margin-bottom:12px">
            <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid #F2F3F5"><span style="font-size:14px;color:#646A73">商品金额</span><span style="font-size:14px">未提供</span></div>
            <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid #F2F3F5"><span style="font-size:14px;color:#646A73">优惠券</span><span style="font-size:14px;color:#8F959E">未提供</span></div>
            <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 0"><span style="font-size:14px;color:#646A73">实付金额</span><span style="font-size:18px;font-weight:700;color:#646A73">未提供</span></div>
          </div>
          <div style="background:#fff;border-radius:14px;padding:4px 16px">
            <div style="font-size:13px;color:#8F959E;padding:14px 0 6px">支付方式</div>
            <div style="padding:14px 0 16px;color:#646A73;font-size:14px">未提供；不会默认选择或调用任何支付渠道。</div>
          </div>
          <p style="margin:14px 4px 0;font-size:12px;line-height:19px;color:#A6AAB0">支付能力未接入；页面不会创建订单、扣款、退款或跳转成功页。</p>
        </div>
        <div style="flex:none;display:grid;grid-template-columns:minmax(0,1fr) 140px;gap:12px;align-items:center;padding:10px 14px 22px;background:#fff;border-top:1px solid #EDEEF0">
          <div style="min-width:0"><div style="font-size:12px;color:#8F959E">实付</div><div style="font-size:19px;font-weight:700;color:#646A73;line-height:24px">未提供</div></div>
          <button disabled aria-disabled="true" onClick="{{ act.pay }}" style="height:50px;border:0;border-radius:12px;background:var(--accent,#3370ff);color:#fff;font-size:16px;font-weight:600;cursor:pointer">立即支付</button>
