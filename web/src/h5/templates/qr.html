<div style="position:relative;display:flex;align-items:center;justify-content:center;height:44px;background:#fff;border-bottom:1px solid #EDEEF0;flex:none">
          <span style="font-size:16px;font-weight:600">周期服务</span>
          <span style="position:absolute;right:16px;letter-spacing:1px;color:#1F2329">···</span>
        </div>
        <div data-h5-blocked role="status" style="padding:9px 14px;border-bottom:1px solid #FFE0B2;background:#FFF7E8;color:#8A4B08;font-size:12px;line-height:18px">{{ blockedReason }}</div>
        <div style="flex:1;min-height:0;overflow:hidden;background:#fff;position:relative">
          <div style="padding:24px 20px 26px;background:linear-gradient(150deg,#16233A 0%,#25406E 62%,#2C55A8 100%);color:#fff">
            <span style="display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;background:rgba(255,255,255,.16);font-size:12px;font-weight:600">状态未读取</span>
            <h1 style="margin:14px 0 0;font-size:25px;line-height:33px;font-weight:600">服务信息待后端契约</h1>
          </div>
          <div style="margin:-16px 14px 0;position:relative;background:#fff;border:1px solid #EDEEF0;border-radius:14px;padding:18px 16px">
            <div style="font-size:13px;color:#8F959E">剩余有效期</div>
            <div style="font-size:28px;line-height:44px;font-weight:700">未提供</div>
          </div>
          <div style="position:absolute;inset:0;background:rgba(20,24,31,.55);display:flex;align-items:center;justify-content:center;padding:24px">
            <div style="width:100%;background:#fff;border-radius:16px;padding:24px 20px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.24)">
              <div style="font-size:17px;font-weight:600">二维码未提供</div>
              <p style="margin:8px 0 0;font-size:13px;line-height:20px;color:#8F959E">当前 OpenAPI 没有此服务群二维码契约，未生成本地占位码。</p>
              <div style="width:206px;height:206px;margin:16px auto 0;border-radius:14px;border:1px dashed #C9CDD4;background:#F5F6F7;display:flex;align-items:center;justify-content:center;color:#8F959E;font-size:13px">等待后端能力</div>
              <a data-h5-local-exit role="button" onClick="{{ act.close }}" style="display:block;box-sizing:border-box;width:100%;height:44px;line-height:44px;margin-top:18px;border:1px solid #DEE0E3;border-radius:10px;background:#fff;font-size:15px;font-weight:600;color:#646A73;cursor:pointer;text-align:center">关闭</a>
            </div>
          </div>
        </div>
        <div style="flex:none;display:grid;grid-template-columns:minmax(0,1fr) 132px;gap:12px;align-items:center;padding:10px 14px 22px;background:#fff;border-top:1px solid #EDEEF0">
          <div style="min-width:0"><div style="font-size:14px;font-weight:600">周期服务</div><div style="font-size:12px;color:#8F959E;margin-top:3px">权益状态未提供</div></div>
          <button disabled aria-disabled="true" onClick="{{ act.renew }}" style="height:50px;border:0;border-radius:12px;background:var(--accent,#3370ff);color:#fff;font-size:16px;font-weight:600;cursor:pointer">续费</button>
