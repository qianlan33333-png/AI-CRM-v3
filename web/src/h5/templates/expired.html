<div style="position:relative;display:flex;align-items:center;justify-content:center;height:44px;background:#fff;border-bottom:1px solid #EDEEF0;flex:none">
          <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#1F2329" stroke-width="1.6" style="position:absolute;left:14px"><path d="M9.6 3.6L5.2 8l4.4 4.4"/></svg>
          <span style="font-size:16px;font-weight:600">周期服务</span>
          <span style="position:absolute;right:16px;letter-spacing:1px;color:#1F2329">···</span>
        </div>
        <div data-h5-blocked role="status" style="padding:9px 14px;border-bottom:1px solid #FFE0B2;background:#FFF7E8;color:#8A4B08;font-size:12px;line-height:18px">{{ blockedReason }}</div>
        <div style="flex:1;min-height:0;overflow:auto;background:#fff">
          <div style="padding:24px 20px 26px;background:linear-gradient(150deg,#2A2E36 0%,#3B4250 100%);color:#fff">
            <span style="display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;background:rgba(255,255,255,.16);font-size:12px;font-weight:600">状态未读取</span>
            <h1 style="margin:14px 0 0;font-size:25px;line-height:33px;font-weight:600">服务信息待后端契约</h1>
            <p style="margin:10px 0 0;font-size:14px;line-height:22px;color:rgba(255,255,255,.72)">未读取权益状态、到期日或重新开通条件。</p>
          </div>
          <div style="margin:-16px 14px 0;position:relative;background:#fff;border:1px solid #EDEEF0;border-radius:14px;padding:18px 16px;box-shadow:0 4px 16px rgba(31,35,41,.06)">
            <div style="font-size:30px;line-height:36px;font-weight:700;color:#646A73">不可执行</div>
            <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 0 0;margin-top:12px;border-top:1px solid #F2F3F5"><span style="font-size:14px;color:#8F959E">上次到期日</span><span style="font-size:15px;font-weight:600">未提供</span></div>
            <div style="display:flex;align-items:center;justify-content:space-between;padding-top:12px"><span style="font-size:14px;color:#8F959E">重新开通信息</span><span style="font-size:15px;font-weight:600">未提供</span></div>
          </div>
          <div style="padding:18px 14px 24px">
            <div style="font-size:15px;font-weight:600;margin-bottom:12px">服务详情</div>
            <div style="display:flex;flex-direction:column;gap:8px">
              <div style="height:180px;background:linear-gradient(135deg,#E9EBEF,#CFD3DA);border-radius:12px"></div>
              <div style="height:200px;background:linear-gradient(135deg,#EFF1F4,#DDE0E5);border-radius:12px"></div>
            </div>
          </div>
        </div>
        <div style="flex:none;display:grid;grid-template-columns:minmax(0,1fr) 132px;gap:12px;align-items:center;padding:10px 14px 22px;background:#fff;border-top:1px solid #EDEEF0">
          <div style="min-width:0"><div style="font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">周期服务</div><div style="font-size:12px;color:#8F959E;margin-top:3px">价格与周期未提供</div></div>
          <button disabled aria-disabled="true" onClick="{{ act.renew }}" style="height:50px;border:0;border-radius:12px;background:var(--accent,#3370ff);color:#fff;font-size:16px;font-weight:600;cursor:pointer">重新开通</button>
