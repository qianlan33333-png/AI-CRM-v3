<div style="position:relative;display:flex;align-items:center;justify-content:center;height:44px;background:#fff;border-bottom:1px solid #EDEEF0;flex:none">
  <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#1F2329" stroke-width="1.6" style="position:absolute;left:14px"><path d="M9.6 3.6L5.2 8l4.4 4.4"/></svg>
  <span style="font-size:16px;font-weight:600">增长诊断测评</span>
  <span style="position:absolute;right:16px;letter-spacing:1px;color:#1F2329">···</span>
</div>
<div style="flex:1;min-height:0;overflow:auto;background:#F5F6F7;padding:14px 14px 24px">
  <div style="background:#fff;border-radius:14px;padding:20px 18px;margin-bottom:12px">
    <span style="display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;background:#EFF4FF;color:var(--accent,#3370ff);font-size:12px;font-weight:600">问卷入口</span>
    <h1 style="margin:12px 0 0;font-size:22px;line-height:30px;font-weight:600">{{ title }}</h1>
    <p style="margin:8px 0 0;font-size:14px;line-height:22px;color:#8F959E;white-space:pre-wrap">{{ description }}</p>
  </div>
  <sc-if value="{{ loading }}"><div role="status" style="background:#fff;border-radius:14px;padding:18px;color:#646A73">正在读取真实问卷…</div></sc-if>
  <sc-if value="{{ error }}"><div role="alert" data-h5-error style="background:#FDECEE;border-radius:12px;padding:14px;color:#D83931">{{ error }}<sc-if value="{{ canRetry }}"><button onClick="{{ act.retry }}" style="display:block;margin-top:10px;height:34px;border:1px solid #F98E8B;border-radius:8px;background:#fff;color:#D83931">重试读取</button></sc-if></div></sc-if>
  <sc-if value="{{ ready }}">
    <sc-for list="{{ questions }}" as="question">
      <sc-if value="{{ question.supported }}">
        <div data-question-id="{{ question.id }}" style="background:#fff;border-radius:14px;padding:16px 16px 18px;margin-bottom:12px">
          <div style="font-size:15px;font-weight:600;line-height:22px;margin-bottom:4px">{{ question.title }} <span style="color:#F54A45">{{ question.required }}</span></div>
          <div style="font-size:13px;color:#A6AAB0;margin-bottom:12px">{{ question.hint }}</div>
          <sc-for list="{{ question.options }}" as="option">
            <label data-option-id="{{ option.id }}" aria-pressed="{{ option.selected }}" onClick="{{ option.pick }}" style="display:flex;align-items:flex-start;gap:10px;padding:13px 14px;margin-bottom:10px;border-radius:12px;cursor:pointer;{{ option.style }}"><span>{{ option.mark }}</span><span style="font-size:15px;line-height:22px">{{ option.text }}</span></label>
          </sc-for>
        </div>
      </sc-if>
      <sc-if value="{{ question.unsupported }}">
        <div data-h5-unsupported style="background:#fff;border-radius:14px;padding:16px 16px 18px;margin-bottom:12px;opacity:.6">
          <div style="font-size:15px;font-weight:600;line-height:22px;margin-bottom:4px;color:#646A73">{{ question.title }}</div>
          <div style="font-size:13px;color:#A6AAB0;margin-bottom:12px">{{ question.hint }}</div>
          <div style="height:44px;border-radius:10px;background:#F2F3F5;display:flex;align-items:center;justify-content:center;color:#A6AAB0;font-size:13px">暂不可作答</div>
        </div>
      </sc-if>
    </sc-for>
    <button data-h5-submit onClick="{{ act.submitAll }}" style="width:100%;height:48px;border:0;border-radius:12px;background:var(--accent,#3370ff);color:#fff;font-size:16px;font-weight:600;cursor:pointer">提交</button>
    <sc-if value="{{ submitting }}"><div role="status" style="text-align:center;margin-top:10px;color:#8F959E">正在提交，请勿重复操作…</div></sc-if>
  </sc-if>
  <sc-if value="{{ submitted }}"><div data-h5-receipt style="background:#fff;border-radius:14px;padding:18px"><h2 style="margin:0;font-size:18px">已收到本地提交回执</h2><p style="font-size:13px;color:#646A73">外部推送、支付和授权均未执行。</p><a data-h5-result-link href="{{ resultPath }}" style="color:#245BDB">查询真实提交结果</a></div></sc-if>
</div>
