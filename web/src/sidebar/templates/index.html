<div id="sidebar-workbench-root" class="sidebar-shell">
  <header class="customer-card">
    <div id="sidebar-jssdk-status" class="sidebar-sdk-status" data-state="idle">正在确认企微 SDK 侧边栏上下文…</div>
    <div class="customer-line">
      <div class="name" id="customer-name">识别中</div>
      <span class="binding-state" id="binding-state">上下文待确认</span>
      <span class="customer-line-spacer"></span>
      <button type="button" class="btn" id="customer-phone-edit" hidden>换手机号</button>
    </div>
    <div class="meta" id="customer-mobile"></div>
  </header>
  <nav class="tabs" id="tabs" aria-label="侧边栏模块"></nav>

  <div
    id="sidebar-context-status"
    class="sidebar-status"
    role="status"
    aria-live="polite"
  >
    正在识别当前企微客户…
  </div>

  <main id="content" class="content"></main>
</div>
<div id="phone-modal" class="modal-overlay" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="phone-modal-title">
    <div class="modal-head">
      <span id="phone-modal-title">更换手机号</span>
      <button type="button" class="modal-close" id="phone-modal-close" aria-label="关闭">×</button>
    </div>
    <label class="modal-field">
      <span>手机号</span>
      <input
        id="sidebar-phone-input"
        type="tel"
        inputmode="numeric"
        placeholder="请输入 11 位手机号"
        maxlength="11"
        autocomplete="off"
      >
    </label>
    <div class="panel-meta" id="sidebar-phone-status">仅绑定当前客户；不支持从其他客户强制抢占手机号。</div>
    <div class="modal-actions">
      <button type="button" class="btn" id="phone-modal-cancel">取消</button>
      <button type="button" class="btn primary" id="phone-modal-save">保存</button>
    </div>
  </div>
</div>
<div id="toast" class="hidden-control" role="status" aria-live="polite"></div>
