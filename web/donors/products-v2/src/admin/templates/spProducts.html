
          <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;height:52px;padding:0 20px;background:#fff;border-bottom:1px solid #DEE0E3;flex:none">
            <div style="display:flex;align-items:center;gap:10px;min-width:0">
              <div style="min-width:0">
                <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:#8F959E;line-height:14px"><span>客户管理后台</span><span>/</span><span>交易</span></div>
                <div style="font-size:16px;font-weight:600;line-height:22px">周期商品管理</div>
              </div>
            </div>
          </div>
          <div style="flex:1;min-height:0;overflow:auto;padding:16px 20px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-content:start">
            <div style="background:#fff;border:1px solid #DEE0E3;border-radius:8px;overflow:hidden">
              <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid #EFF0F1">
                <div style="font-size:13px;font-weight:600;color:#646A73">共 {{ spPage.total }} 个周期商品</div><button onClick="{{ go.spProductForm }}" style="height:30px;padding:0 12px;border:0;border-radius:6px;background:var(--accent,#3370ff);color:#fff;font-size:13px;cursor:pointer;white-space:nowrap;flex:none">创建周期商品</button>
              </div>
              <div style="overflow-x:auto">
                <table style="width:100%;min-width:1040px;border-collapse:collapse">
                  <thead><tr><th style="padding:9px 12px;font-size:12px;font-weight:500;color:#8F959E;text-align:left;background:#FAFAFB;border-bottom:1px solid #DEE0E3;white-space:nowrap;width:170px">商品编码</th><th style="padding:9px 12px;font-size:12px;font-weight:500;color:#8F959E;text-align:left;background:#FAFAFB;border-bottom:1px solid #DEE0E3;white-space:nowrap;width:220px">商品名称</th><th style="padding:9px 12px;font-size:12px;font-weight:500;color:#8F959E;text-align:left;background:#FAFAFB;border-bottom:1px solid #DEE0E3;white-space:nowrap;width:215px">价格</th><th style="padding:9px 12px;font-size:12px;font-weight:500;color:#8F959E;text-align:left;background:#FAFAFB;border-bottom:1px solid #DEE0E3;white-space:nowrap;width:90px">状态</th><th style="padding:9px 12px;font-size:12px;font-weight:500;color:#8F959E;text-align:left;background:#FAFAFB;border-bottom:1px solid #DEE0E3;white-space:nowrap;width:110px">已售卖数量</th><th style="padding:9px 12px;font-size:12px;font-weight:500;color:#8F959E;text-align:left;background:#FAFAFB;border-bottom:1px solid #DEE0E3;white-space:nowrap;width:160px">更新时间</th><th style="padding:9px 16px;font-size:12px;font-weight:500;color:#8F959E;text-align:right;background:#FAFAFB;border-bottom:1px solid #DEE0E3;white-space:nowrap;width:300px">操作</th></tr></thead>
                  <tbody>
                    <sc-for list="{{ rows.spProducts }}" as="p" hint-placeholder-count="4">
                    <tr>
                    <td style="padding:var(--rp,10px) 12px;border-bottom:1px solid #F2F3F5;font-size:13px;text-align:left;vertical-align:middle"><span style="font-family:ui-monospace,Menlo,monospace;font-size:13px">{{ p.code }}</span></td>
                    <td style="padding:var(--rp,10px) 12px;border-bottom:1px solid #F2F3F5;font-size:13px;text-align:left;vertical-align:middle"><span style="font-weight:500">{{ p.name }}</span></td>
                    <td style="padding:var(--rp,10px) 12px;border-bottom:1px solid #F2F3F5;font-size:13px;text-align:left;vertical-align:middle"><span style="font-size:13px">{{ p.price }}</span></td>
                    <td style="padding:var(--rp,10px) 12px;border-bottom:1px solid #F2F3F5;font-size:13px;text-align:left;vertical-align:middle"><span style="{{ p.cs }}">{{ p.status }}</span></td>
                    <td style="padding:var(--rp,10px) 12px;border-bottom:1px solid #F2F3F5;font-size:13px;text-align:left;vertical-align:middle"><span style="font-variant-numeric:tabular-nums">{{ p.sold }}</span></td>
                    <td style="padding:var(--rp,10px) 12px;border-bottom:1px solid #F2F3F5;font-size:13px;text-align:left;vertical-align:middle"><span style="font-size:12px;color:#646A73">{{ p.updated }}</span></td>
                    <td style="padding:var(--rp,10px) 16px;border-bottom:1px solid #F2F3F5;font-size:13px;text-align:right;vertical-align:middle"><div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end"><button onClick="{{ p.edit }}" style="height:26px;padding:0 9px;border:1px solid #DEE0E3;border-radius:5px;background:#fff;color:#344054;font-size:12px;cursor:pointer;white-space:nowrap">编辑</button><button onClick="{{ p.data }}" style="height:26px;padding:0 9px;border:1px solid #C5D6FF;border-radius:5px;background:#F5F9FF;color:#245BDB;font-size:12px;cursor:pointer;white-space:nowrap">数据</button><button onClick="{{ p.shareIt }}" style="height:26px;padding:0 9px;border:1px solid #DEE0E3;border-radius:5px;background:#fff;color:#344054;font-size:12px;cursor:pointer;white-space:nowrap">分享</button><button onClick="{{ p.copyIt }}" style="height:26px;padding:0 9px;border:1px solid #DEE0E3;border-radius:5px;background:#fff;color:#344054;font-size:12px;cursor:pointer;white-space:nowrap">复制</button><button onClick="{{ p.toggle }}" style="height:26px;padding:0 9px;border:1px solid #DEE0E3;border-radius:5px;background:#fff;color:#344054;font-size:12px;cursor:pointer;white-space:nowrap">{{ p.toggleText }}</button><button onClick="{{ p.archive }}" style="height:26px;padding:0 9px;border:1px solid #FBC4C2;border-radius:5px;background:#FFF5F5;color:#D83931;font-size:12px;cursor:pointer;white-space:nowrap">归档</button></div></td>
                  </tr>
                    </sc-for>
                </tbody>
                </table>
              </div>
            </div>
          </div>

          <!-- 分享弹窗（生产 #service-period-share-modal） -->
          <sc-if value="{{ share.open }}">
          <div style="position:fixed;inset:0;background:rgba(15,23,42,.34);z-index:80;display:flex;align-items:center;justify-content:center;padding:24px">
            <div style="width:min(400px,100%);background:#fff;border-radius:12px;box-shadow:0 24px 64px rgba(15,23,42,.22);overflow:hidden">
              <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #EFF0F1"><span style="font-size:15px;font-weight:600;color:#1F2329">分享{{ share.kind }} · {{ share.title }}</span><button onClick="{{ share.close }}" style="width:28px;height:28px;border:0;border-radius:6px;background:#F2F3F5;color:#646A73;cursor:pointer;font-size:14px">×</button></div>
              <div style="padding:18px;display:grid;gap:14px">
                <div style="display:grid;gap:6px"><label style="font-size:12px;color:#646A73;font-weight:500">分享链接</label>
                  <div style="display:flex;gap:8px"><input value="{{ share.url }}" readonly="readonly" style="height:34px;flex:1;border:1px solid #DEE0E3;border-radius:6px;padding:0 10px;font-size:12px;background:#F7F8FA;color:#646A73;font-family:ui-monospace,Menlo,monospace;min-width:0"><button onClick="{{ share.copyLink }}" style="height:34px;padding:0 14px;border:1px solid #DEE0E3;border-radius:6px;background:#fff;color:#1F2329;font-size:13px;cursor:pointer;flex:none">复制</button><button onClick="{{ share.preview }}" style="height:34px;padding:0 14px;border:1px solid #DEE0E3;border-radius:6px;background:#fff;color:#1F2329;font-size:13px;cursor:pointer;flex:none">预览</button></div>
                </div>
                <div style="display:grid;justify-items:center;gap:10px"><div id="shareQrBox" style="width:180px;height:180px;border:1px solid #EFF0F1;border-radius:8px;padding:6px;box-sizing:content-box"></div><button onClick="{{ share.saveQr }}" style="height:30px;padding:0 14px;border:1px solid #DEE0E3;border-radius:6px;background:#fff;color:#1F2329;font-size:13px;cursor:pointer">保存二维码</button></div>
              </div>
            </div>
          </div>
          </sc-if>
