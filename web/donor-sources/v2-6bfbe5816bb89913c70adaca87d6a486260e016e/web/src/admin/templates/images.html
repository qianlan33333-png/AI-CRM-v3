
          <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;height:52px;padding:0 20px;background:#fff;border-bottom:1px solid #DEE0E3;flex:none">
            <div style="min-width:0">
              <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:#8F959E;line-height:14px"><span>客户管理后台</span><span>/</span><span>素材</span></div>
              <div style="font-size:16px;font-weight:600;line-height:22px">图片素材库</div>
            </div>
            <button onClick="{{ imagesPage.openUpload }}" style="height:30px;padding:0 12px;border:0;border-radius:6px;background:var(--accent,#3370ff);color:#fff;font-size:13px;cursor:pointer;flex:none">上传图片</button>
          </div>
          <div style="flex:1;min-height:0;overflow:auto;padding:16px 20px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-content:start">
            <div style="background:#fff;border:1px solid #DEE0E3;border-radius:8px;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">
              <input placeholder="搜索素材名或标签" style="height:32px;flex:1 1 240px;border:1px solid #DEE0E3;border-radius:6px;padding:0 10px;font-size:13px;background:#fff">
              <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:#646A73;margin-left:auto;cursor:pointer"><input type="checkbox" style="width:14px;height:14px;accent-color:#3370ff">含已停用</label>
              <button style="height:32px;padding:0 12px;border:1px solid #DEE0E3;border-radius:6px;background:#fff;color:#646A73;font-size:13px;cursor:pointer">重置</button>
            </div>
            <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px">
              <sc-for list="{{ rows.images }}" as="m" hint-placeholder-count="8">
                <div style="background:#fff;border:1px solid #DEE0E3;border-radius:8px;overflow:hidden">
                 <div style="{{ m.off }}">
                  <div onClick="{{ m.open }}" style="{{ m.thumb }}"></div>
                  <div style="padding:10px 12px">
                    <div onClick="{{ m.open }}" style="font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer">{{ m.name }}</div>
                    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px">
                      <span style="font-size:12px;color:#A6AAB0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ m.size }}</span>
                      <span style="{{ m.cs }}">{{ m.tag }}</span>
                    </div>
                    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid #F5F6F7">
                      <span style="font-size:11px;color:#A6AAB0">{{ m.uploadedAt }}</span>
                      <button onClick="{{ m.open }}" style="height:24px;padding:0 8px;border:0;border-radius:4px;background:transparent;color:#245BDB;font-size:12px;cursor:pointer">编辑</button>
                    </div>
                  </div>
                 </div>
                </div>
              </sc-for>
            </div>
          </div>

          <!-- 图片详情 / 编辑弹窗（生产素材库 edit 弹窗） -->
          <sc-if value="{{ imagesPage.editOpen }}">
          <div style="position:fixed;inset:0;background:rgba(15,23,42,.34);z-index:80;display:flex;align-items:center;justify-content:center;padding:24px">
            <div style="width:min(520px,100%);background:#fff;border-radius:12px;box-shadow:0 24px 64px rgba(15,23,42,.22);overflow:hidden">
              <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #EFF0F1"><span style="font-size:15px;font-weight:600;color:#1F2329">编辑图片素材</span><button onClick="{{ imagesPage.closeModal }}" style="width:28px;height:28px;border:0;border-radius:6px;background:#F2F3F5;color:#646A73;cursor:pointer;font-size:14px">×</button></div>
              <div style="padding:18px;display:grid;gap:14px">
                <div style="display:flex;gap:14px;align-items:flex-start">
                  <div style="width:132px;height:132px;border-radius:10px;flex:none;background:{{ imagesPage.editing.bg }}"></div>
                  <div style="display:grid;gap:6px;font-size:12px;color:#8F959E;flex:1;min-width:0">
                    <div>尺寸 / 大小：<span style="color:#646A73">{{ imagesPage.editing.size }}</span></div>
                    <div>上传时间：<span style="color:#646A73">{{ imagesPage.editing.uploadedAt }}</span></div>
                    <div>标签：<span style="display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:4px;background:#F2F3F5;color:#646A73;font-size:11px">{{ imagesPage.editing.tag }}</span></div>
                    <button onClick="{{ imagesPage.replaceImage }}" style="height:30px;padding:0 12px;border:1px solid #DEE0E3;border-radius:6px;background:#fff;color:#344054;font-size:12px;cursor:pointer;justify-self:start;margin-top:4px">更换图片</button>
                  </div>
                </div>
                <div><label style="display:block;font-size:12px;color:#646A73;margin-bottom:6px;font-weight:500">素材名称</label><input id="fImgName" value="{{ imagesPage.editing.name }}" style="height:34px;width:100%;border:1px solid #DEE0E3;border-radius:6px;padding:0 10px;font-size:13px;box-sizing:border-box"></div>
                <div><label style="display:block;font-size:12px;color:#646A73;margin-bottom:6px;font-weight:500">描述</label><input id="fImgDesc" value="{{ imagesPage.editing.desc }}" placeholder="用途说明，便于同事选择" style="height:34px;width:100%;border:1px solid #DEE0E3;border-radius:6px;padding:0 10px;font-size:13px;box-sizing:border-box"></div>
                <div><label style="display:block;font-size:12px;color:#646A73;margin-bottom:6px;font-weight:500">标签（逗号分隔）</label><input id="fImgTags" value="{{ imagesPage.editing.tags }}" style="height:34px;width:100%;border:1px solid #DEE0E3;border-radius:6px;padding:0 10px;font-size:13px;box-sizing:border-box"></div>
              </div>
              <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 18px;border-top:1px solid #EFF0F1;background:#FAFBFC">
                <div style="display:flex;gap:8px">
                  <button onClick="{{ imagesPage.del }}" style="height:32px;padding:0 12px;border:1px solid #FBC4C2;border-radius:6px;background:#FFF5F5;color:#D83931;font-size:13px;cursor:pointer">删除</button>
                  <button onClick="{{ imagesPage.toggle }}" style="height:32px;padding:0 12px;border:1px solid #DEE0E3;border-radius:6px;background:#fff;color:#646A73;font-size:13px;cursor:pointer">{{ imagesPage.toggleText }}</button>
                </div>
                <div style="display:flex;gap:8px">
                  <button onClick="{{ imagesPage.closeModal }}" style="height:32px;padding:0 14px;border:1px solid #DEE0E3;border-radius:6px;background:#fff;color:#1F2329;font-size:13px;cursor:pointer">取消</button>
                  <button onClick="{{ imagesPage.save }}" style="height:32px;padding:0 16px;border:0;border-radius:6px;background:var(--accent,#3370ff);color:#fff;font-size:13px;cursor:pointer">保存</button>
                </div>
              </div>
            </div>
          </div>
          </sc-if>

          <!-- 上传图片弹窗 -->
          <sc-if value="{{ imagesPage.uploadOpen }}">
          <div style="position:fixed;inset:0;background:rgba(15,23,42,.34);z-index:80;display:flex;align-items:center;justify-content:center;padding:24px">
            <div style="width:min(480px,100%);background:#fff;border-radius:12px;box-shadow:0 24px 64px rgba(15,23,42,.22);overflow:hidden">
              <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #EFF0F1"><span style="font-size:15px;font-weight:600;color:#1F2329">上传图片</span><button onClick="{{ imagesPage.closeModal }}" style="width:28px;height:28px;border:0;border-radius:6px;background:#F2F3F5;color:#646A73;cursor:pointer;font-size:14px">×</button></div>
              <div style="padding:18px;display:grid;gap:14px">
                <div><label style="display:block;font-size:12px;color:#646A73;margin-bottom:6px;font-weight:500">图片文件</label><input id="fImgUpFile" type="file" accept="image/*" style="width:100%;font-size:13px"></div>
                <div><label style="display:block;font-size:12px;color:#646A73;margin-bottom:6px;font-weight:500">素材名称</label><input id="fImgUpName" placeholder="留空则使用文件名" style="height:34px;width:100%;border:1px solid #DEE0E3;border-radius:6px;padding:0 10px;font-size:13px;box-sizing:border-box"></div>
                <div><label style="display:block;font-size:12px;color:#646A73;margin-bottom:6px;font-weight:500">标签（逗号分隔）</label><input id="fImgUpTags" placeholder="如：直播,预告" style="height:34px;width:100%;border:1px solid #DEE0E3;border-radius:6px;padding:0 10px;font-size:13px;box-sizing:border-box"></div>
              </div>
              <div style="display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid #EFF0F1;background:#FAFBFC">
                <button onClick="{{ imagesPage.closeModal }}" style="height:32px;padding:0 14px;border:1px solid #DEE0E3;border-radius:6px;background:#fff;color:#1F2329;font-size:13px;cursor:pointer">取消</button>
                <button onClick="{{ imagesPage.submitUpload }}" style="height:32px;padding:0 16px;border:0;border-radius:6px;background:var(--accent,#3370ff);color:#fff;font-size:13px;cursor:pointer">上传</button>
              </div>
            </div>
          </div>
          </sc-if>
