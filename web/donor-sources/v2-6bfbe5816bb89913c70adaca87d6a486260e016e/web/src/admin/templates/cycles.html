
          <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;height:52px;padding:0 20px;background:#fff;border-bottom:1px solid #DEE0E3;flex:none">
            <div style="min-width:0">
              <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:#8F959E;line-height:14px"><span>客户管理后台</span><span>/</span><span>运营</span></div>
              <div style="font-size:16px;font-weight:600;line-height:22px">运营闭环</div>
            </div>
          </div>
          <div style="flex:1;min-height:0;overflow:auto;padding:16px 20px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-content:start">
            <div style="background:#fff;border:1px solid #DEE0E3;border-radius:8px;overflow:hidden">
              <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid #EFF0F1">
                <div style="min-width:0"><h2 style="margin:0;font-size:14px;font-weight:600">任务列表</h2></div><div style="display:flex;align-items:center;gap:8px;flex:none"><span style="font-size:12px;color:#8F959E">共 {{ cycles.total }} 个</span></div>
              </div>
              <table style="width:100%;border-collapse:collapse">
                <thead><tr><th style="padding:9px 12px;font-size:12px;font-weight:500;color:#8F959E;text-align:left;background:#FAFAFB;border-bottom:1px solid #DEE0E3;white-space:nowrap;width:220px">任务名称</th><th style="padding:9px 12px;font-size:12px;font-weight:500;color:#8F959E;text-align:left;background:#FAFAFB;border-bottom:1px solid #DEE0E3;white-space:nowrap">本周进度</th><th style="padding:9px 16px;font-size:12px;font-weight:500;color:#8F959E;text-align:right;background:#FAFAFB;border-bottom:1px solid #DEE0E3;white-space:nowrap">操作</th></tr></thead>
                <tbody>
                  <sc-for list="{{ cycles.rows }}" as="t" hint-placeholder-count="3">
                  <tr><td style="padding:var(--rp,10px) 12px;border-bottom:1px solid #F2F3F5;font-size:13px;text-align:left;vertical-align:middle"><div style="display:flex;align-items:flex-start;gap:8px"><span style="width:8px;height:8px;border-radius:50%;background:{{ t.dot }};flex:none;margin-top:5px"></span><div style="min-width:0"><div style="font-size:13px;font-weight:500">{{ t.name }}</div><div style="font-size:12px;color:#8F959E;margin-top:2px">{{ t.cron }}</div></div></div></td><td style="padding:var(--rp,10px) 12px;border-bottom:1px solid #F2F3F5;font-size:13px;text-align:left;vertical-align:middle"><ol style="display:flex;align-items:center;gap:10px;margin:0;padding:0;flex-wrap:wrap"><sc-for list="{{ t.steps }}" as="st"><li style="display:flex;align-items:center;gap:5px;list-style:none"><span style="width:8px;height:8px;border-radius:50%;background:{{ st.color }};flex:none"></span><span style="font-size:12px;color:{{ st.tc }};white-space:nowrap">{{ st.label }}</span></li></sc-for></ol></td><td style="padding:var(--rp,10px) 16px;border-bottom:1px solid #F2F3F5;font-size:13px;text-align:right;vertical-align:middle"><div style="display:flex;align-items:center;gap:8px;justify-content:flex-end"><button onClick="{{ t.act }}" style="height:28px;padding:0 12px;border:0;border-radius:6px;background:var(--accent,#3370ff);color:#fff;font-size:12px;cursor:pointer;white-space:nowrap">{{ t.action }}</button><button onClick="{{ t.viewDetail }}" style="height:24px;padding:0 6px;border:0;border-radius:4px;background:transparent;color:#245BDB;font-size:12px;cursor:pointer;white-space:nowrap">查看详情</button></div></td></tr>
                  </sc-for>
                </tbody>
              </table>
            </div>
            <div style="border:1px dashed #DEE0E3;border-radius:8px;background:#fff;padding:18px;text-align:center">
              <div style="font-size:13px;font-weight:600">暂无运营任务</div>
              <div style="font-size:12px;color:#8F959E;margin-top:4px">策略完成首次上报后会显示在这里。</div>
            </div>
          </div>
