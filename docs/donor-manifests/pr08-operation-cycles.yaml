schema: 1
capability: PR08-operation-cycle-lifecycle
source_repository: qianlan33333-png/AI-CRM-v2
source_path: /tmp/aicrm-v2-audit.yN3jmr
source_commit: 6bfbe5816bb89913c70adaca87d6a486260e016e
target_base_commit: 19384b9
target_branch: codex/import-operation-cycles
transfer_mode: constrained-domain-preparation

scope:
  included:
    - operation-cycle strategy definitions and immutable version snapshots
    - local run records and snapshot revisions
    - action stage contracts and queued/claimed/thread-bound/turn-started terminal states
    - strategy draft/active/paused/archived lifecycle semantics
    - runner compatibility and heartbeat acceptance facts
    - strategy-change proposal pending/accepted/rejected facts
    - transaction-bound local idempotency, event, and delivery seams
    - exact frozen cycles page and run-dossier templates
  excluded:
    - customer, external-user, mobile, tenant, segment, audience, campaign, or recipient identity
    - customer/segment/audience selection, marking, unmarking, enrollment, or recipient execution
    - WeCom/Provider calls, credentials, tokens, outbound effects, delivery sends, and retries
    - Store, PostgreSQL schema, generated queries, migrations, and historical import/runtime adapters
    - HTTP/auth/composition wiring, OpenAPI, central webshell, deployment, CI, and dependency manifests

backend:
  copied_and_adapted:
    - source: internal/operationcycle/port/port.go
      target: internal/operationcycle/port/port.go
      disposition: exact
      notes: pure strategy/run/runner/action/proposal value contracts and action statuses
    - source: internal/operationcycle/app/service.go
      target: internal/operationcycle/app/service.go
      disposition: adapted
      notes: v3 platform UoW and local operation-cycle event seam; fail-closed excluded-scope validation
    - source: internal/operationcycle/app/service_test.go
      target: internal/operationcycle/app/service_test.go
      disposition: adapted
      notes: idempotent report replay, outcome_unknown terminal recording, and forbidden-scope characterization
  added_v3_adaptation:
    - path: internal/operationcycle/domain/cycle.go
      reason: explicit lifecycle, stage, version, and excluded-identity invariants without customer IDs
    - path: internal/operationcycle/domain/cycle_test.go
      reason: characterization of strategy/action transitions and scope rejection
    - path: internal/operationcycle/port/events.go
      reason: local fact/event delivery seam; Terra adapts it to the versioned v3 event/outbox ports
    - path: internal/operationcycle/README.md
      reason: ownership, safety boundary, and Terra handoff record
  deferred_to_terra:
    - source: internal/operationcycle/store/repository.go
      reason: v3 operationcycle-owned schema, transaction receipts, locking, and generated SQL are not authorized here
    - source: internal/operationcycle/store/fact_delivery.go
      reason: event delivery must be adapted to the v3 transaction/outbox implementation
    - source: internal/operationcycle/store/queries/operation_cycles.sql
      reason: migration and SQLC generation are forbidden in this preparation branch
    - source: internal/operationcycle/store/generated/*
      reason: generated artifacts follow the authorized v3 schema and toolchain
    - source: internal/operationcycle/app/observation_history.go
      reason: V1 historical observations require independent import/version and ownership decisions
    - source: internal/operationcycle/app/static_history.go
      reason: archived static history is read-only and requires its own v3 history schema
    - source: internal/operationcycle/port/observation_history.go
      reason: history reader/writer contract is outside the current lifecycle slice
    - source: internal/operationcycle/port/static_history.go
      reason: history reader/writer contract is outside the current lifecycle slice
    - source: cmd/aicrm/legacy_operation_cycle_api.go
      reason: central auth/HTTP/composition wiring is forbidden; handler methods are retained as contract evidence only

frontend:
  exact_files:
    - source: web/src/admin/templates/cycles.html
      target: web/src/admin/templates/cycles.html
      notes: byte-exact frozen v2 template; no wording, inline style, or interaction changes
    - source: web/src/admin/templates/cyclesDetail.html
      target: web/src/admin/templates/cyclesDetail.html
      notes: byte-exact frozen v2 run-dossier template; no wording, inline style, or interaction changes
  css_ts_and_dependencies:
    disposition: deferred-to-terra
    notes: no standalone cycles-specific TS/CSS exists in the donor; the shared controller/API/types/mock runtime also owns customer, audience, campaign, and recipient branches and is not copied
    contract_evidence:
      - web/src/admin/controller.ts
      - web/src/api/capabilities.ts
      - web/src/shared/api/client.ts
      - web/src/shared/api/types.ts
      - web/src/shared/api/mockData.ts
  historical_frontend_deferred:
    - web/src/api/generated/p4-static-history/p4-static-history.ts
    - web/src/api/staticHistory.ts
    - web/src/admin/sections/staticHistory.ts
    notes: CycleStrategy/CycleVersion/CycleDocument/CycleMetric/CycleReference history needs v3 history HTTP/OpenAPI and is not part of current lifecycle wiring

request_contract:
  source: cmd/aicrm/legacy_operation_cycle_api.go
  disposition: contract-evidence-only
  operations:
    - list/get strategy definitions
    - list/get run records
    - start and inspect local action requests
    - service-authenticated action claim and heartbeat
    - action event recording, including terminal outcome_unknown without automatic retry
    - strategy context read and strategy-change proposal create/list/decide
    - runner report acceptance
  notes: v3 HTTP/auth/OpenAPI routes and central registration remain Terra work; this commit does not wire or expose them

terra_followups:
  - owner: Terra
    item: define operationcycle-owned v3 tables, migrations, SQLC queries, locking/CAS, and transactional idempotency receipts
  - owner: Terra
    item: adapt local event/delivery seams to the v3 versioned event and outbox ports
  - owner: Terra
    item: implement authenticated HTTP/OpenAPI contracts without customer/audience/campaign/recipient execution
  - owner: Terra
    item: decide whether V1 observation/static history is a separate read-only import and expose it only after schema/ownership review
  - owner: Terra
    item: connect any real WeCom write only through outbound with attempted/executed/outcome_unknown/reconciled receipts; never direct from operationcycle
  - owner: Terra
    item: select the exact cycles frontend templates and build a narrowed TS/API adapter after removing shared excluded-domain branches

forbidden_touched:
  - cmd/aicrm
  - api/openapi.yaml
  - migrations
  - go.mod
  - go.sum
  - package*.json
  - deploy
  - CI
  - internal/platform
  - internal/access
  - internal/webshell
