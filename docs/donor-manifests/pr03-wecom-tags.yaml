      request_dto: LegacyTagCreateRequest
      response_dto: CreateLegacyWecomTag200
      success_status: 200
      error_statuses: [400, 401, 403, 404, 503]
      local_effect: tag_create
    - operation: createLegacyWecomTagGroup
      method: POST
      path: /api/admin/wecom/tag-groups
      request_dto: LegacyTagGroupCreateRequest
      response_dto: CreateLegacyWecomTagGroup200
      success_status: 200
      error_statuses: [400, 401, 403, 503]
      local_effect: group_create_with_first_tag
    - operation: getLegacyWecomTagGroup
