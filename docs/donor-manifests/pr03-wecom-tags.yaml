  notes: exact endpoint and payload evidence is implemented by the v3 HTTP/OpenAPI adapter; frozen donor business files are reused without byte changes
  dto_fields:
    LegacyTagGroupCreateRequest: [group_name, first_tag_name, actor, idempotency_key, trace_id, dry_run]
    LegacyTagGroupUpdateRequest: [group_name, actor, idempotency_key, trace_id, dry_run]
    LegacyTagCreateRequest: [group_id, group_name, tag_name, actor, idempotency_key, trace_id, dry_run]
    LegacyTagUpdateRequest: [tag_name, actor, idempotency_key, trace_id, dry_run]
    LegacyTagArchiveRequest: [actor, idempotency_key, trace_id, dry_run]
    LegacyTagSyncRequest: [idempotency_key, trace_id]
    LegacyTagCatalogResponse: [ok, items, tags, groups, count, total_tags, tag_limit, synced_at, source_status, read_model_status, route_owner, fallback_used, real_external_call_executed, sync_executed, fixture_used]
    LegacyTagExecutionGate: [provider_execution_eligible, local_command_acceptance_available, local_queue_available, sync_executed, observed_at, real_external_call_executed]
  ordering_contract:
    app_operations: [ReorderGroups, ReorderTags]
    request_paths: []
    rule: complete permutation of the current IDs is accepted; partial, duplicate, unknown, or stale membership is rejected before mutation
  error_interaction:
    malformed_or_invalid: 400
    unauthorized_or_wrong_scope: 403
    missing_item: 404
    idempotency_conflict: 409
    local_or_provider_dependency_unavailable: 503
    sync_success_copy: 标签同步已受理；尚未收到 Provider 同步结果
    sync_failure_copy: 标签同步受理失败
    safety_fields: [real_external_call_executed, sync_executed]
provider_effect_contract:
  catalog_sync_only:
    accepted: local command/event/receipt transaction
    queued: durable queue acceptance; not Provider execution
    attempted: Provider call started
    executed: Provider read returned a validated complete catalog snapshot
    outcome_unknown: Provider result cannot be proven; manual reconciliation required
    reconciled: original effect resolved with evidence; never replace the idempotency key
  receipt_fields: [effect_id, accept_receipt_id, queue_receipt_id, provider_call_attempted, provider_success_claimed, receipt_digest]
  reconciliation: generic reconciliation may only close an unknown effect with evidence and never writes an observation; a validated fresh snapshot artifact is required for observed/executed state
  notes: v3 outbound owns the opaque catalog intent; the read-only adapter is implemented behind AICRM_WECOM_TAG_CATALOG_PROVIDER_ENABLED plus catalog-read-authorized permission, default false and disabled on id-dev
characterization:
  tests:
    - internal/tag/domain/catalog_test.go
    - internal/tag/domain/gate_test.go
    - internal/tag/app/catalog_test.go
    - internal/tag/app/gate_test.go
    - internal/tag/app/sync_test.go
    - internal/tag/http/handler_test.go
    - internal/tag/ui_test.go
    - internal/tag/store/postgres_integration_test.go
  behaviors:
    - CRUD mutation receipt is transaction-bound and idempotent
    - group-create creates the required first tag
    - archive checks read-only references before mutation
    - reorder accepts a complete permutation and rejects stale partial membership
    - gate projects only the fail-closed allowlist
    - manual and due sync return queued acceptance and never claim Provider execution
exclusion_audit:
  forbidden_terms_not_in_transferred_commands: [external_userid, mark, unmark, customer_id]
  excluded_frontend_behavior: [customer_detail_tagging, customer_tag_mark, customer_tag_unmark, channel_entry_tag_assignment, campaign_or_audience_targeting]
  excluded_routes:
    - POST /api/admin/wecom/tags/live/mark
    - POST /api/admin/wecom/tags/live/unmark
    - POST /api/admin/wecom/tag-effects/{effect_id}/reconcile
completion_evidence:
  - v3-owned 0008 migration and PostgreSQL repository own only tag tables
  - authenticated/CSRF HTTP compatibility and OpenAPI adapters preserve the frozen DTO routes
  - outbound TransactionalAccepter creates the real EER/River acceptance in the same PostgreSQL UoW
  - completed catalog reads atomically transition EER and append the validated tag-owned observation; unknown/final_failed never write a snapshot
remaining_limitation:
  - id-dev configuration keeps the implemented catalog-read adapter disabled; enabling it requires the explicit catalog-read authorization and a separately approved live Provider Journey
