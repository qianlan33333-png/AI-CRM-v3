request_contract:
  source: web/src/api/generated/p4-tag-compat/p4-tag-compat.ts
  source_sha256: ee681aa3460deccb41aad4daea555e3428301d30bafc804860ab6d83df1a930e
  page_entry:
    operation: legacyWecomTagsAdminShell
    method: GET
    path: /admin/wecom-tags
    success: 302
    location: /?legacy_admin_path=%2Fadmin%2Fwecom-tags
    notes: v3-owned webshell adapter must mount the exact tags fragment; do not deploy the donor's second sidebar
  operations:
    - operation: listLegacyWecomTags
      method: GET
      path: /api/admin/wecom/tags
      request_dto: none
      response_dto: LegacyTagCatalogResponse
      success_status: 200
      error_statuses: [401, 403]
      local_effect: read_only_catalog
    - operation: listLegacyWecomTagGroups
      method: GET
      path: /api/admin/wecom/tag-groups
      request_dto: none
      response_dto: LegacyTagGroupsResponse
      success_status: 200
      error_statuses: [401, 403, 503]
      local_effect: read_only_groups
    - operation: createLegacyWecomTag
      method: POST
      path: /api/admin/wecom/tags
      request_dto: LegacyTagCreateRequest
      response_dto: CreateLegacyWecomTag200
      success_status: 200
      error_statuses: [400, 401, 403, 404, 503]
      local_effect: tag_create
    - operation: createLegacyWecomTagGroup
      method: POST
      path: /api/admin/wecom/tag-groups
      request_dto: LegacyTagGroupCreateRequest
      response_dto: CreateLegacyWecomTagGroup200
      success_status: 200
      error_statuses: [400, 401, 403, 503]
      local_effect: group_create_with_first_tag
    - operation: getLegacyWecomTagGroup
      method: GET
      path: /api/admin/wecom/tag-groups/{group_id}
      request_dto: none
      response_dto: LegacyTagGroupResponse
      success_status: 200
      error_statuses: [401, 403, 404, 503]
      local_effect: read_only_group
    - operation: updateLegacyWecomTagGroupPut
      method: PUT
      path: /api/admin/wecom/tag-groups/{group_id}
      request_dto: LegacyTagGroupUpdateRequest
      response_dto: void
      success_status: 200
      error_statuses: [400, 401, 403, 404, 503]
      local_effect: group_update
    - operation: updateLegacyWecomTagGroupPatch
      method: PATCH
      path: /api/admin/wecom/tag-groups/{group_id}
      request_dto: LegacyTagGroupUpdateRequest
      response_dto: LegacyTagGroupUpdateResponse
      success_status: 200
      error_statuses: [400, 401, 403, 404, 503]
