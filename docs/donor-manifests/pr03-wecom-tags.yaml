request_contract:
  source: web/src/api/generated/p4-tag-compat/p4-tag-compat.ts
  source_sha256: ee681aa3460deccb41aad4daea555e3428301d30bafc804860ab6d83df1a930e
  page_entry:
    operation: legacyWecomTagsAdminShell
    method: GET
    path: /admin/wecom-tags
    success: 200
    notes: v3-owned webshell adapter mounts the exact tags fragment in the PR10 one-sidebar admin_base; the donor's second sidebar is never deployed
  operations:
    - operation: listLegacyWecomTags
      method: GET
      path: /api/admin/wecom/tags
      request_dto: none
      response_dto: LegacyTagCatalogResponse
      success_status: 200
      error_statuses: [401, 403]
      local_effect: read_only_catalog
    - operation: listLegacyWecomTagGroups
      method: GET
      path: /api/admin/wecom/tag-groups
      request_dto: none
