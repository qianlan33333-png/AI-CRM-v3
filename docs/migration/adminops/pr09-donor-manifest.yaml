frontend:
  byte_exact_staged_under: web/donors/adminops-v2/src
  archive_readme: web/donors/adminops-v2/README.md
  exact_file_count: 16
  exact_files:
    - web/src/admin/templates/config.html
    - web/src/admin/templates/configDetail.html
    - web/src/admin/templates/apidocs.html
    - web/src/admin/sections/setupWizard.ts
    - web/src/api/generated/health.schemas.ts
    - web/src/api/generated/health/health.ts
    - web/src/api/generated/p4-config-settings-compat/p4-config-settings-compat.ts
    - web/src/api/generated/p4-api-docs-compat/p4-api-docs-compat.ts
    - web/src/api/generated/p4-setup-wizard/p4-setup-wizard.ts
    - web/src/api/generated/p4-adminops-safe/p4-adminops-safe.ts
    - web/src/api/generated/p4-data-health/p4-data-health.ts
    - web/src/api/generated/p4-legacy-health/p4-legacy-health.ts
    - web/src/api/generated/p4-system-health/p4-system-health.ts
    - web/src/api/generated/p4-execution-runtime-compat/p4-execution-runtime-compat.ts
    - web/src/api/generated/p4-release-plane/p4-release-plane.ts
    - web/src/api/transport.ts
  generated_contract_notes:
    - p4-adminops-safe is retained byte-exact as one generated artifact; only
      category, push-capability, release-read, and local diagnostic contract
      operations are in scope. Broadcast, Feishu notification, archive-sync,
      callback, message-batch, and other effect branches remain unmounted.
    - p4-setup-wizard includes the donor's AdminAccess operations because the
      unchanged config page exposes that adjacent control. AdminAccess HTTP,
      internal/access changes, and route registration remain excluded.
    - setupWizard.ts imports the donor api/transport.ts; that transport is
      archived byte-exact so the setup-wizard module has a closed archive
      dependency without copying the mixed v2 admin bootstrap.
    - health.schemas.ts is a generated shared dependency and therefore retains
      unrelated donor schema declarations byte-exact; Terra must narrow imports
      before runtime wiring and must not expose excluded routes.
  integration: The archive is not active web/src code. Terra/Web must select
    the exact config/API-docs assets and mount them through a v3-owned adapter
    into PR10 internal/webshell/admin_base and its one primary sidebar. Do not
    copy or deploy a full v2 shell, duplicate .side markup, or edit donor bytes.

terra_followups:
  - owner: Terra/Config
    item: decide the v3 startup/config ownership split, implement Config-owned
      PostgreSQL tables, CAS/locking, audit/idempotency, and migration without
      importing v2 schema or runtime aliases
  - owner: Terra/Config
    item: adapt the local EventAppender seam to v3 versioned event/outbox
      persistence in the same transaction; never append secrets or setting
      values to events
  - owner: Terra/AdminOps
    item: implement the Admin Ops-owned repository, generated SQL, receipts,
      audit, and authenticated HTTP/OpenAPI routes behind the local port;
      preserve secret-reference-only behavior
  - owner: Terra/AdminOps
    item: decide which local job kinds are safe to expose; keep customer,
      identity-repair, payment, recipient, and Provider execution absent
  - owner: Terra/Release
    item: implement release-owned schema, locking/CAS, audit/outbox and route
      adapters; use the service only for local attestations and reconciliation
      evidence, never as a deploy/traffic switch executor
  - owner: Terra/Outbound
    item: translate any future external-effect intent through outbound and
      independently reconcile accepted/attempted/outcome_unknown/executed
      states; no direct WeCom or Provider path from Config/AdminOps/Release
  - owner: Terra/Web
    item: narrow generated imports and mount only the config, API-docs,
      setup-wizard, release, and diagnostic donor hooks through PR10's unique
      v3 webshell; remove unscoped AdminOps and shared health-schema branches
      before exposing routes

