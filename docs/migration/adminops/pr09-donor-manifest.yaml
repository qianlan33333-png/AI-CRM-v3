rules:
  backend: v2 leaf behavior is adapted only to v3 module paths and local
    ports; no v2 module, generated SQL, migration, runtime, HTTP, OpenAPI,
    composition, deployment, CI, or Provider dependency is introduced
  frontend: listed donor files are byte-exact snapshots under web/donors;
    release-private generated fragments and the existing frozen admin runtime
    are mounted only through the v3 single-shell adapter. Wording, inline CSS,
    interaction, and generated request contracts are not rewritten
  effects: configuration and release services record local intents/evidence
    only; any eventual WeCom or other external write must be translated by
    outbound and independently reconciled
  shell: PR10 v3-owned internal/webshell/admin_base and its primary sidebar
    remain the only production shell; Terra must mount donor business hooks
    through a v3 adapter and must not deploy a second v2 .side navigation

scope:
  included:
    - non-secret configuration setting keys, closed value validation, and
      local transaction/event seams
    - app-settings projection with masked secret configured state and audit
      metadata, plus setup-wizard two-key CAS/readback behavior
    - Admin Ops credential-reference, category, release-record, local-job,
      and notification configuration mutation behavior with idempotency and
      fail-closed secret checks
    - read-only Admin Ops runtime/timeline observation bounding and redaction
    - local release candidate registration, prerequisite evidence, readiness,
      cutover journal/generation/fence state, rollback checks, and
      reconciliation-gated lifecycle transitions
    - exact config, setup-wizard, API-docs, release, Admin Ops-safe, and
      health/diagnostic frontend request/template donor files
  excluded:
    - customer, OneID, identity repair, phone, external-user, segment,
      audience, Campaign, questionnaire, radar, marking, unmarking,
      enrollment, recipient selection, or recipient execution
    - direct WeCom, Feishu, Provider, payment, backup, deployment, traffic
      switch, credential material, token exchange, retries, or delivery claims
    - v2 config startup schema/load aliases that mix payment, customer,
      audience, tag, outbound, and composition concerns
    - Store/PostgreSQL/generated SQL, migrations, historical import, workers,
      HTTP/auth, OpenAPI, composition, deployment, CI, and dependency files

