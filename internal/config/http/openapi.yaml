      - {$ref: "#/components/parameters/GroupOpsWebhookKey"}
      - {$ref: "#/components/parameters/GroupOpsWebhookClientID"}
      - {$ref: "#/components/parameters/GroupOpsWebhookTimestamp"}
      - {$ref: "#/components/parameters/GroupOpsWebhookEventID"}
      - {$ref: "#/components/parameters/GroupOpsWebhookSignature"}
    post:
      operationId: acceptGroupOpsWebhook
      tags: [GroupOps]
      security: [{groupOpsWebhook: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
      responses: {"202": {description: Durable local run/EER intent accepted after HMAC and digest-only replay claim; Provider remains disabled, content: {application/json: {schema: {$ref: "#/components/schemas/GroupOpsRunSummary"}}}}, "400": {$ref: "#/components/responses/Error"}, "401": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}, "503": {$ref: "#/components/responses/Unavailable"}}
  /api/admin/config/app-settings:
    get:
      operationId: getLegacyAppSettings
      tags: [Config]
      security: [{adminSession: []}]
      responses: {"200": {description: Safe local configuration projection, content: {application/json: {schema: {$ref: "#/components/schemas/ConfigSettingsRead"}}}}, "401": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "503": {$ref: "#/components/responses/Unavailable"}}
    put:
      operationId: saveLegacyAppSettings
      tags: [Config]
      security: [{adminSession: [], csrfHeader: []}]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}, {name: X-Admin-Action-Token, in: header, schema: {type: string, minLength: 50, maxLength: 200}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ConfigSettingsWrite"}}}}
      responses: {"200": {description: Local settings saved; no runtime or Provider application, content: {application/json: {schema: {$ref: "#/components/schemas/ConfigSettingsWriteResponse"}}}}, "400": {$ref: "#/components/responses/Error"}, "401": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}, "503": {$ref: "#/components/responses/Unavailable"}}
  /api/admin/setup-wizard:
    get:
      operationId: getSetupWizard
      tags: [Config]
      security: [{adminSession: []}]
      responses: {"200": {description: Local-only setup snapshot, content: {application/json: {schema: {$ref: "#/components/schemas/SetupWizardRead"}}}}, "401": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "503": {$ref: "#/components/responses/Unavailable"}}
    post:
      operationId: saveSetupWizard
      tags: [Config]
      security: [{adminSession: [], csrfHeader: []}]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SetupWizardWrite"}}}}
      responses: {"200": {description: Atomically stored local Corp/Agent IDs, content: {application/json: {schema: {$ref: "#/components/schemas/SetupWizardSave"}}}}, "400": {$ref: "#/components/responses/Error"}, "401": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}, "503": {$ref: "#/components/responses/Unavailable"}}
  /api/admin/config/categories:
    get:
      operationId: listConfigCategories
      tags: [Config]
      security: [{adminSession: []}]
      responses: {"200": {description: Closed safe category projection, content: {application/json: {schema: {$ref: "#/components/schemas/LocalProjection"}}}}, "401": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}}
  /api/admin/config/categories/{category_key}:
    get:
      operationId: getConfigCategory
      tags: [Config]
      security: [{adminSession: []}]
      parameters: [{name: category_key, in: path, required: true, schema: {type: string, enum: [app-settings, push-capabilities, releases, runtime-diagnostics]}}]
      responses: {"200": {description: Safe category projection, content: {application/json: {schema: {$ref: "#/components/schemas/LocalProjection"}}}}, "401": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}}
  /api/admin/config/categories/{category_key}/enabled:
    put:
      operationId: setConfigCategoryEnabled
      tags: [Config]
      security: [{adminSession: [], csrfHeader: []}]
      parameters: [{name: category_key, in: path, required: true, schema: {type: string, enum: [app-settings, push-capabilities, releases, runtime-diagnostics]}}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [enabled, admin_action_token], additionalProperties: false, properties: {enabled: {type: boolean}, admin_action_token: {type: string, minLength: 50, maxLength: 200}}}}}}
      responses: {"200": {description: Atomically persisted local category enablement; no Provider call, content: {application/json: {schema: {$ref: "#/components/schemas/LocalProjection"}}}}, "400": {$ref: "#/components/responses/Error"}, "401": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}, "503": {$ref: "#/components/responses/Unavailable"}}
  /api/admin/config/categories/{category_key}/check:
    post:
      operationId: checkConfigCategory
      tags: [Config]
      security: [{adminSession: [], csrfHeader: []}]
      parameters: [{name: category_key, in: path, required: true, schema: {type: string, enum: [app-settings, push-capabilities, releases, runtime-diagnostics]}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [admin_action_token], additionalProperties: false, properties: {admin_action_token: {type: string, minLength: 50, maxLength: 200}}}}}}
      responses: {"200": {description: Current local safe-projection check; no Provider call, content: {application/json: {schema: {$ref: "#/components/schemas/LocalProjection"}}}}, "400": {$ref: "#/components/responses/Error"}, "401": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}, "503": {$ref: "#/components/responses/Unavailable"}}
  /api/admin/config/categories/{category_key}/settings:
    put:
      operationId: saveConfigCategorySettings
      tags: [Config]
      description: Persists the selected readonly v3 category state for the frozen detail-page Save action; no Provider call.
      security: [{adminSession: [], csrfHeader: []}]
      parameters: [{name: category_key, in: path, required: true, schema: {type: string, enum: [push-capabilities, releases, runtime-diagnostics]}}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [values, switches, admin_action_token], additionalProperties: false, properties: {values: {type: object, additionalProperties: {type: string}, maxProperties: 0}, switches: {type: object, additionalProperties: {type: boolean}, maxProperties: 0}, admin_action_token: {type: string, minLength: 50, maxLength: 200}}}}}}
      responses: {"200": {description: Atomically persisted local category save receipt, content: {application/json: {schema: {$ref: "#/components/schemas/LocalProjection"}}}}, "400": {$ref: "#/components/responses/Error"}, "401": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}, "503": {$ref: "#/components/responses/Unavailable"}}
  /api/admin/config/push-capabilities:
    get:
      operationId: listPushCapabilities
      tags: [Config]
      security: [{adminSession: []}]
      responses: {"200": {description: Read-only local safe projection, content: {application/json: {schema: {$ref: "#/components/schemas/AdminConfigProjection"}}}}, "401": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}}
  /api/admin/config/releases:
    get:
      operationId: listReleaseProjections
      tags: [Config]
      security: [{adminSession: []}]
      responses: {"200": {description: Read-only local release projection, content: {application/json: {schema: {$ref: "#/components/schemas/AdminConfigProjection"}}}}, "401": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}}
  /api/admin/config/diagnostics:
    get:
      operationId: listAdminDiagnostics
      tags: [Config]
      security: [{adminSession: []}]
      responses: {"200": {description: Bounded persisted local diagnostic observations, content: {application/json: {schema: {$ref: "#/components/schemas/AdminConfigProjection"}}}}, "401": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "503": {$ref: "#/components/responses/Unavailable"}}
  /api/admin/config/openapi.yaml:
    get:
      operationId: downloadCurrentOpenAPI
      tags: [Config]
      security: [{adminSession: []}]
      responses: {"200": {description: Current v3 OpenAPI document, content: {application/yaml: {schema: {type: string}}}}, "401": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}}
components:
  securitySchemes:
    adminSession: {type: apiKey, in: cookie, name: aicrm_admin_session}
    sidebarSession: {type: apiKey, in: cookie, name: aicrm_sidebar_session}
    csrfHeader: {type: apiKey, in: header, name: X-CSRF-Token}
    contextToken: {type: http, scheme: bearer}
    groupOpsWebhook: {type: apiKey, in: header, name: X-AICRM-Signature}
  parameters:
    ID: {name: id, in: path, required: true, schema: {$ref: "#/components/schemas/PositiveID"}}
    ProductID: {name: product_id, in: path, required: true, schema: {$ref: "#/components/schemas/PositiveID"}}
    ServiceProductID: {name: service_product_id, in: path, required: true, schema: {$ref: "#/components/schemas/PositiveID"}}
    TagID: {name: tag_id, in: path, required: true, schema: {$ref: "#/components/schemas/PositiveID"}}
    TagGroupID: {name: group_id, in: path, required: true, schema: {$ref: "#/components/schemas/PositiveID"}}
    ExternalEffectID: {name: id, in: path, required: true, schema: {$ref: "#/components/schemas/ExternalEffectID"}}
    PushJobID: {name: job_id, in: path, required: true, schema: {$ref: "#/components/schemas/PositiveID"}}
    ExternalEffectsView: {name: view, in: query, required: true, schema: {type: string, const: external-effects}}
    PushJobQuery: {name: job, in: query, schema: {$ref: "#/components/schemas/PositiveID"}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: false, description: Explicit keys replay or reject payload drift. Frozen v2 Media controls omit this header; the compatibility adapter mints and audits a fresh per-request key., schema: {type: string, minLength: 1, maxLength: 200}}
    MediaImageCategory: {name: category, in: query, schema: {type: string, maxLength: 64}}
    MediaQuery: {name: q, in: query, schema: {type: string, maxLength: 200}}
    EnabledOnly: {name: enabled_only, in: query, schema: {type: boolean, default: true}}
    ImageTags: {name: tags, in: query, schema: {type: string, maxLength: 4096, description: Comma-separated intersection tag filter.}}
    ImageTagGroup: {name: tag_group, in: query, schema: {type: string, maxLength: 4096, description: Repeatable comma-separated tag group filter.}}
    OnlyUnlabeled: {name: only_unlabeled, in: query, schema: {type: boolean, default: false}}
    IncludeData: {name: include_data, in: query, schema: {type: boolean, default: false}}
    MediaImageDetailVariant: {name: variant, in: query, schema: {type: string, enum: [thumb_160, thumb_320, mobile_1080, large_1440, original]}}
    CustomerID: {name: customer_id, in: path, required: true, schema: {$ref: "#/components/schemas/PositiveID"}}
    SafeNext: {name: next, in: query, schema: {type: string, pattern: "^/"}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
    ProductLimit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
    ProductOffset: {name: offset, in: query, schema: {type: integer, minimum: 0, maximum: 1000000, default: 0}}
    MediaLimit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 50}}
    Offset: {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
    BeforeID: {name: before_id, in: query, schema: {type: integer, format: int64, minimum: 1}}
    ReceiptID: {name: receipt_id, in: path, required: true, schema: {$ref: "#/components/schemas/PositiveID"}}
    MessageSignature: {name: msg_signature, in: query, required: true, schema: {type: string}}
    Timestamp: {name: timestamp, in: query, required: true, schema: {type: string, pattern: "^[0-9]+$"}}
    Nonce: {name: nonce, in: query, required: true, schema: {type: string}}
    RequiredIdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 200}}
    GroupOpsPlanID: {name: plan_id, in: path, required: true, schema: {$ref: "#/components/schemas/PositiveID"}}
    GroupOpsStaffID: {name: staff_id, in: path, required: true, schema: {$ref: "#/components/schemas/PositiveID"}}
    GroupOpsAssetReference: {name: asset_reference, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9._:-]{1,128}$"}}
    GroupOpsChatID: {name: chat_id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9._:-]{1,128}$"}}
    GroupOpsNodeID: {name: node_id, in: path, required: true, schema: {$ref: "#/components/schemas/PositiveID"}}
    GroupOpsExecutionID: {name: execution_id, in: path, required: true, schema: {$ref: "#/components/schemas/PositiveID"}}
    GroupOpsWebhookKey: {name: webhook_key, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9._:-]{1,128}$"}}
    GroupOpsWebhookClientID: {name: X-AICRM-Client-Id, in: header, required: true, schema: {type: string, const: aicrm-webhook-group-ops}}
    GroupOpsWebhookTimestamp: {name: X-AICRM-Timestamp, in: header, required: true, schema: {type: string, pattern: "^[0-9]{1,20}$"}}
    GroupOpsWebhookEventID: {name: X-AICRM-Event-Id, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 256}}
    GroupOpsWebhookSignature: {name: X-AICRM-Signature, in: header, required: true, schema: {type: string, pattern: "^[0-9a-fA-F]{64}$"}}
  responses:
    Error: {description: Stable error response, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
    Unavailable: {description: Dependency or provider unavailable, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
    MutationOK: {description: Mutation completed, content: {application/json: {schema: {type: object, required: [ok], properties: {ok: {const: true}}}}}}
  schemas:
    PositiveID: {type: integer, format: int64, minimum: 1}
    LocalProjection:
      type: object
      required: [ok, items, source_status, local_only]
      properties: {ok: {const: true}, items: {type: array, items: {}}, source_status: {type: string}, local_only: {const: true}}
    AdminConfigProjection:
      type: object
      required: [ok, source_status, local_only, real_external_call_executed]
      properties:
        ok: {const: true}
        source_status: {type: string}
        local_only: {const: true}
        real_external_call_executed: {const: false}
        capabilities: {type: object, additionalProperties: true}
        releases: {type: array, items: {$ref: "#/components/schemas/AdminConfigReleaseProjection"}}
        diagnostics: {type: array, items: {$ref: "#/components/schemas/AdminConfigDiagnosticProjection"}}
    AdminConfigReleaseProjection:
      type: object
      required: [id, state, checksum]
      properties:
        id: {$ref: "#/components/schemas/PositiveID"}
        state: {type: string, enum: [observed, active, superseded, failed]}
        checksum: {type: string, minLength: 1, maxLength: 200}
    AdminConfigDiagnosticProjection:
      type: object
      required: [id, key, status, observed_at]
      properties:
        id: {$ref: "#/components/schemas/PositiveID"}
        key: {type: string, minLength: 1, maxLength: 120}
        status: {type: string, enum: [ok, warning, error, unknown]}
        observed_at: {type: string, format: date-time}
    ConfigSettingsRead:
      type: object
      required: [ok, config, source_status, fallback_used, admin_action_token]
      properties: {ok: {const: true}, config: {type: object}, source_status: {const: next_read_model}, fallback_used: {const: false}, admin_action_token: {type: string, minLength: 50, maxLength: 200, pattern: '^[A-Za-z0-9_-]+$'}}
    ConfigSettingsWrite:
      type: object
      additionalProperties: false
      required: [settings, confirm]
      properties: {settings: {type: object, additionalProperties: {oneOf: [{type: string}, {type: integer}]}}, confirm: {const: true}, admin_action_token: {type: string, minLength: 50, maxLength: 200}}
    ConfigSettingsWriteResponse:
      type: object
      required: [ok, changed, changed_count, config, source_status, fallback_used, real_external_call_executed]
      properties: {ok: {const: true}, changed: {type: array, maxItems: 12, items: {type: object}}, changed_count: {type: integer, minimum: 0, maximum: 12}, config: {type: object}, source_status: {const: next_command}, fallback_used: {const: false}, real_external_call_executed: {const: false}}
    SetupWizardRead:
      type: object
      required: [ok, expected_digest, editable, editable_configured, masked, admin_action_token, external, local_only, runtime_applied]
      properties: {ok: {const: true}, expected_digest: {type: string, pattern: '^[a-f0-9]{64}$'}, editable: {type: object}, editable_configured: {type: object}, masked: {type: object}, admin_action_token: {type: string, minLength: 50, maxLength: 200}, external: {const: false}, local_only: {const: true}, runtime_applied: {const: false}}
    SetupWizardWrite:
      type: object
      additionalProperties: false
      required: [wecom.corp_id, wecom.agent_id, wecom.secret, wecom.callback_token, wecom.callback_aes_key, ai.api_key, expected_digest, admin_action_token]
      properties: {wecom.corp_id: {type: string, minLength: 1, maxLength: 256}, wecom.agent_id: {type: integer, minimum: 1}, wecom.secret: {type: string, maxLength: 0}, wecom.callback_token: {type: string, maxLength: 0}, wecom.callback_aes_key: {type: string, maxLength: 0}, ai.api_key: {type: string, maxLength: 0}, expected_digest: {type: string, pattern: '^[a-f0-9]{64}$'}, admin_action_token: {type: string, minLength: 50, maxLength: 200}}
    SetupWizardSave:
      type: object
      required: [ok, config, receipt, external, local_only, runtime_applied]
      properties: {ok: {const: true}, config: {type: object}, receipt: {type: object}, external: {const: false}, local_only: {const: true}, runtime_applied: {const: false}}
    CouponRuleUpsert:
      type: object
      additionalProperties: false
      required: [name, discount_amount_total, total_issue_limit, claim_starts_at, claim_ends_at, validity_mode, target_refs]
      properties:
        name: {type: string, minLength: 1, maxLength: 45}
        discount_amount_total: {type: integer, format: int64, minimum: 1}
        total_issue_limit: {type: integer, format: int64, minimum: 1}
        per_user_issue_limit: {type: integer, format: int64, minimum: 1}
        claim_starts_at: {type: string, format: date-time}
        claim_ends_at: {type: string, format: date-time}
        validity_mode: {type: string, enum: [fixed_range, relative_days]}
        use_starts_at: {type: [string, "null"], format: date-time}
        use_ends_at: {type: [string, "null"], format: date-time}
        relative_validity_days: {type: [integer, "null"], minimum: 1}
        instructions: {type: string, maxLength: 200}
        target_refs: {type: array, minItems: 1, maxItems: 100, items: {type: string, pattern: "^(standard_product|service_period):[1-9][0-9]*$"}}
    CouponRule:
      type: object
      additionalProperties: true
      required: [id, name, discount_amount_total, currency, status, total_issue_limit, per_user_issue_limit, issued_count, claim_starts_at, claim_ends_at, validity_mode, target_refs, created_by, updated_by, version, created_at, updated_at]
      properties:
        id: {$ref: "#/components/schemas/PositiveID"}
        resource_id: {$ref: "#/components/schemas/PositiveID"}
        name: {type: string}
        discount_amount_total: {type: integer, format: int64}
        currency: {const: CNY}
        status: {type: string, enum: [draft, published, stopped, archived, deleted]}
        availability_status: {type: string}
        total_issue_limit: {type: integer, format: int64}
        per_user_issue_limit: {type: integer, format: int64}
        issued_count: {type: integer, format: int64}
        claim_starts_at: {type: string, format: date-time}
        claim_ends_at: {type: string, format: date-time}
        validity_mode: {type: string, enum: [fixed_range, relative_days]}
        target_refs: {type: array, items: {type: string}}
        created_by: {$ref: "#/components/schemas/PositiveID"}
        updated_by: {$ref: "#/components/schemas/PositiveID"}
        version: {type: integer, format: int64, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    CouponRuleEnvelope:
      type: object
      required: [ok, coupon]
      properties: {ok: {const: true}, coupon: {$ref: "#/components/schemas/CouponRule"}}
    CouponRuleListEnvelope:
      type: object
      required: [ok, coupons, items, total, limit, offset]
      properties: {ok: {const: true}, coupons: {type: array, items: {$ref: "#/components/schemas/CouponRule"}}, items: {type: array, items: {$ref: "#/components/schemas/CouponRule"}}, total: {type: integer, minimum: 0}, limit: {type: integer, minimum: 1}, offset: {type: integer, minimum: 0}}
    CouponProductOptionPage:
      type: object
      required: [ok, items, total, limit, offset]
      properties: {ok: {const: true}, items: {type: array, items: {type: object, required: [id, target_ref, name, price_minor, currency], properties: {id: {$ref: "#/components/schemas/PositiveID"}, target_ref: {type: string}, name: {type: string}, price_minor: {type: integer, format: int64}, currency: {const: CNY}}}}, total: {type: integer, minimum: 0}, limit: {type: integer, minimum: 1}, offset: {type: integer, minimum: 0}}
    ProductAdminProjection:
      type: object
      additionalProperties: false
      required: [schema_version, status, enabled, buy_button_text, require_mobile, lead_qr_title, lead_qr_subtitle, completion_redirect_enabled, completion_redirect_url, wecom_tagging, slices]
      properties:
        schema_version: {type: integer, const: 1}
        status: {type: string, minLength: 1, maxLength: 64}
        enabled: {type: boolean}
        buy_button_text: {type: string, maxLength: 2048}
        require_mobile: {type: boolean}
        lead_program_id: {type: [integer, "null"], format: int64, minimum: 1}
        lead_channel_id: {type: [integer, "null"], format: int64, minimum: 1}
        lead_qr_title: {type: string, maxLength: 2048}
        lead_qr_subtitle: {type: string, maxLength: 2048}
        completion_redirect_enabled: {type: boolean}
        completion_redirect_url: {type: string, maxLength: 2048}
        completion_target: {type: [object, "null"], additionalProperties: true}
        wecom_tagging: {type: object, additionalProperties: true}
        slices: {type: array, maxItems: 20, items: {type: object, additionalProperties: true}}
    Product:
      type: object
      additionalProperties: false
      required: [id, product_code, name, description, price_minor, currency, stock_quantity, images, admin_projection, created_by, created_at, updated_at, version]
      properties:
        id: {$ref: "#/components/schemas/PositiveID"}
        product_code: {type: string, minLength: 1, maxLength: 200}
        name: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 10000}
        price_minor: {type: integer, format: int64, minimum: 0}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        stock_quantity: {type: integer, format: int32, minimum: 0}
        images: {type: array, maxItems: 20, items: {type: string, minLength: 1, maxLength: 2048}}
        admin_projection: {$ref: "#/components/schemas/ProductAdminProjection"}
        created_by: {$ref: "#/components/schemas/PositiveID"}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        version: {$ref: "#/components/schemas/PositiveID"}
    ProductPage:
      type: object
      additionalProperties: false
