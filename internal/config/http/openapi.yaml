openapi: 3.1.0
info:
  title: AI-CRM v3 Foundation API
  version: 0.4.0
  description: OneID, employee access, durable WeCom callback and customer directory, External Effects, and Media contracts.
servers:
  - url: https://id-dev.youcangogogo.com
paths:
  /healthz:
    get:
      operationId: getHealth
      responses:
        "200": {description: Process is alive, content: {application/json: {schema: {$ref: "#/components/schemas/StatusResponse"}}}}
  /readyz:
    get:
      operationId: getReadiness
      responses:
        "200": {description: PostgreSQL and migrations are ready, content: {application/json: {schema: {$ref: "#/components/schemas/StatusResponse"}}}}
        "503": {$ref: "#/components/responses/Unavailable"}
  /login:
    get:
      operationId: loginPage
      parameters: [{$ref: "#/components/parameters/SafeNext"}]
      responses:
        "200": {description: Login HTML, content: {text/html: {schema: {type: string}}}}
    post:
      operationId: passwordLogin
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded: {schema: {$ref: "#/components/schemas/LoginRequest"}}
          application/json: {schema: {$ref: "#/components/schemas/LoginRequest"}}
      responses:
        "200": {description: JSON login result and Secure cookies, content: {application/json: {schema: {$ref: "#/components/schemas/LoginResponse"}}}}
        "303": {description: Browser redirect after successful login}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /logout:
    post:
      operationId: logout
      security: [{adminSession: [], csrfHeader: []}]
      responses:
        "200": {$ref: "#/components/responses/MutationOK"}
        "303": {description: Browser redirect to login}
        "403": {$ref: "#/components/responses/Error"}
  /auth/wecom/start:
    get:
      operationId: startAdminWeComOAuth
      parameters:
        - {$ref: "#/components/parameters/SafeNext"}
        - {name: mode, in: query, schema: {type: string, enum: [qr, oauth], default: qr}}
      responses:
        "302": {description: Redirect to WeCom authorization}
        "400": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /auth/wecom/callback:
    get:
      operationId: completeAdminWeComOAuth
      parameters:
        - {name: state, in: query, required: true, schema: {type: string}}
        - {name: code, in: query, required: true, schema: {type: string}}
      responses:
        "302": {description: Secure admin session issued}
        "400": {$ref: "#/components/responses/Error"}
  /admin/config/login-access:
    get:
      operationId: employeeAccessPage
      security: [{adminSession: []}]
      responses:
        "200": {description: Employee access HTML, content: {text/html: {schema: {type: string}}}}
        "303": {description: Redirect to login}
  /admin/oneid:
    get:
      operationId: oneIDAdministrationPage
      security: [{adminSession: []}]
      responses:
        "200": {description: OneID read-only administration HTML, content: {text/html: {schema: {type: string}}}}
        "303": {description: Redirect to login}
  /admin/external-effects:
    get:
      operationId: openExternalEffectsWorkspace
      description: Stable v3 entrypoint. It redirects to the frozen donor URL alias so unchanged donor navigation and job detail links continue to work.
      security: [{adminSession: []}]
      parameters: [{$ref: "#/components/parameters/ExternalEffectsView"}, {$ref: "#/components/parameters/PushJobQuery"}]
      responses:
        "303": {description: "Redirect to /admin/campaigns.html?view=external-effects, preserving a valid job query."}
        "403": {$ref: "#/components/responses/Error"}
  /admin/campaigns.html:
    get:
      operationId: externalEffectsDonorURLAlias
      description: Compatibility alias for the frozen donor runtime. Only view=external-effects and an optional positive job are served; no Campaign capability is exposed.
      security: [{adminSession: []}]
      parameters: [{$ref: "#/components/parameters/ExternalEffectsView"}, {$ref: "#/components/parameters/PushJobQuery"}]
      responses:
        "200": {description: v3 admin shell with the frozen External Effects stage mount, content: {text/html: {schema: {type: string}}}}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /admin/image-library:
    get:
      operationId: openImageLibraryWorkspace
      security: [{adminSession: []}]
      responses: {"200": {description: v3 shell with frozen image-library donor template}, "403": {$ref: "#/components/responses/Error"}}
  /admin/miniprogram-library:
    get:
      operationId: openMiniProgramLibraryWorkspace
      security: [{adminSession: []}]
      responses: {"200": {description: v3 shell with frozen mini-program donor template}, "403": {$ref: "#/components/responses/Error"}}
  /admin/attachment-library:
    get:
      operationId: openAttachmentLibraryWorkspace
      security: [{adminSession: []}]
      responses: {"200": {description: v3 shell with frozen attachment donor template}, "403": {$ref: "#/components/responses/Error"}}
  /api/admin/image-library:
    get:
      operationId: listMediaImages
      tags: [Media]
      security: [{adminSession: []}]
      parameters: [{$ref: "#/components/parameters/MediaLimit"}, {$ref: "#/components/parameters/Offset"}, {$ref: "#/components/parameters/MediaQuery"}, {$ref: "#/components/parameters/MediaImageCategory"}, {$ref: "#/components/parameters/EnabledOnly"}, {$ref: "#/components/parameters/ImageTags"}, {$ref: "#/components/parameters/ImageTagGroup"}, {$ref: "#/components/parameters/OnlyUnlabeled"}]
      responses: {"200": {description: Local image page, content: {application/json: {schema: {$ref: "#/components/schemas/MediaImageListEnvelope"}}}}, "401": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}}
    post:
      operationId: createMediaImage
      tags: [Media]
      security: [{adminSession: [], csrfHeader: []}]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/MediaImageCreateRequest"}}, multipart/form-data: {schema: {$ref: "#/components/schemas/MediaImageMultipartRequest"}}}}
      responses: {"200": {description: Local image created, content: {application/json: {schema: {$ref: "#/components/schemas/MediaImageEnvelope"}}}}, "400": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}}
  /api/admin/image-library/{id}:
    get:
      operationId: getMediaImage
      tags: [Media]
      security: [{adminSession: []}]
      parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/IncludeData"}, {$ref: "#/components/parameters/MediaImageDetailVariant"}]
      responses: {"200": {description: Local image metadata, content: {application/json: {schema: {$ref: "#/components/schemas/MediaImageEnvelope"}}}}, "401": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}}
    put:
      operationId: updateMediaImage
      tags: [Media]
      security: [{adminSession: [], csrfHeader: []}]
      parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/MediaImageUpdateRequest"}}}}
      responses: {"200": {description: Local image updated, content: {application/json: {schema: {$ref: "#/components/schemas/MediaImageEnvelope"}}}}, "400": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}}
    delete:
      operationId: deleteMediaImage
      tags: [Media]
      security: [{adminSession: [], csrfHeader: []}]
      parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      responses: {"200": {description: Image deleted when unreferenced, content: {application/json: {schema: {$ref: "#/components/schemas/MediaImageDeleteEnvelope"}}}}, "403": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}}
  /api/admin/image-library/{id}/variants/{variant}:
    get:
      operationId: getMediaImageVariant
      tags: [Media]
      security: [{adminSession: []}]
      parameters: [{$ref: "#/components/parameters/ID"}, {name: variant, in: path, required: true, schema: {type: string, enum: [thumb_160, thumb_320, mobile_1080, large_1440, original]}}]
      responses: {"200": {description: Authenticated image variant bytes, headers: {ETag: {required: true, schema: {type: string, pattern: '^"[0-9a-f]{64}"$'}}}, content: {image/png: {schema: {type: string, format: binary}}, image/jpeg: {schema: {type: string, format: binary}}, image/gif: {schema: {type: string, format: binary}}}}, "304": {description: ETag matched, headers: {ETag: {required: true, schema: {type: string}}}}, "401": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}, "422": {$ref: "#/components/responses/Error"}}
  /api/admin/image-library/facets:
    get:
      operationId: listMediaImageFacets
      tags: [Media]
      security: [{adminSession: []}]
      responses: {"200": {description: Local image categories and tags, content: {application/json: {schema: {$ref: "#/components/schemas/MediaImageFacetsEnvelope"}}}}, "401": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}}
  /api/admin/image-library/upload:
    post:
      operationId: uploadLegacyMediaImage
      tags: [Media]
      description: Frozen Media multipart compatibility alias. Missing Idempotency-Key receives an audited server compatibility key.
      security: [{adminSession: [], csrfHeader: []}]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {multipart/form-data: {schema: {$ref: "#/components/schemas/MediaImageMultipartRequest"}}}}
      responses: {"200": {description: Local image created, content: {application/json: {schema: {$ref: "#/components/schemas/MediaImageUploadEnvelope"}}}}, "400": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}}
  /api/admin/attachment-library:
    get:
      operationId: listMediaAttachments
      tags: [Media]
      security: [{adminSession: []}]
      parameters: [{$ref: "#/components/parameters/MediaLimit"}, {$ref: "#/components/parameters/Offset"}, {$ref: "#/components/parameters/EnabledOnly"}, {$ref: "#/components/parameters/MediaQuery"}]
      responses: {"200": {description: Local private attachment page, content: {application/json: {schema: {$ref: "#/components/schemas/MediaAttachmentListEnvelope"}}}}, "401": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}}
    post:
      operationId: createMediaAttachment
      tags: [Media]
      security: [{adminSession: [], csrfHeader: []}]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {multipart/form-data: {schema: {$ref: "#/components/schemas/MediaAttachmentMultipartRequest"}}}}
      responses: {"200": {description: Local PDF attached, content: {application/json: {schema: {$ref: "#/components/schemas/MediaAttachmentEnvelope"}}}}, "400": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}}
  /api/admin/attachment-library/{id}:
    get: {operationId: getMediaAttachment, tags: [Media], security: [{adminSession: []}], parameters: [{$ref: "#/components/parameters/ID"}], responses: {"200": {description: Attachment metadata, content: {application/json: {schema: {$ref: "#/components/schemas/MediaAttachmentEnvelope"}}}}, "401": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}}}
    put: {operationId: updateMediaAttachment, tags: [Media], security: [{adminSession: [], csrfHeader: []}], parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/IdempotencyKey"}], requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/MediaAttachmentUpdateRequest"}}}}, responses: {"200": {description: CAS metadata updated, content: {application/json: {schema: {$ref: "#/components/schemas/MediaAttachmentEnvelope"}}}}, "400": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}}}
    delete: {operationId: deleteMediaAttachment, tags: [Media], security: [{adminSession: [], csrfHeader: []}], parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/IdempotencyKey"}], responses: {"200": {description: Attachment deleted when unreferenced, content: {application/json: {schema: {$ref: "#/components/schemas/MediaDeleteEnvelope"}}}}, "403": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}}}
  /api/admin/attachment-library/{id}/download:
    get: {operationId: downloadMediaAttachment, tags: [Media], security: [{adminSession: []}], parameters: [{$ref: "#/components/parameters/ID"}], responses: {"200": {description: Authenticated PDF bytes, content: {application/pdf: {schema: {type: string, format: binary}}}}, "401": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}}}
  /api/admin/attachment-library/upload:
    post: {operationId: uploadLegacyMediaAttachment, tags: [Media], security: [{adminSession: [], csrfHeader: []}], parameters: [{$ref: "#/components/parameters/IdempotencyKey"}], requestBody: {required: true, content: {multipart/form-data: {schema: {$ref: "#/components/schemas/MediaAttachmentMultipartRequest"}}}}, responses: {"200": {description: Local PDF uploaded, content: {application/json: {schema: {$ref: "#/components/schemas/MediaAttachmentEnvelope"}}}}, "400": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}}}
  /api/admin/attachment-library/uploads:
    post:
      operationId: initiateMediaAttachmentMultipartUpload
      tags: [Media]
      security: [{adminSession: [], csrfHeader: []}]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/MediaAttachmentUploadInitiateRequest"}}}}
      responses: {"201": {description: Private upload reserved, content: {application/json: {schema: {$ref: "#/components/schemas/MediaAttachmentUploadInitiated"}}}}, "400": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}}
  /api/admin/attachment-library/uploads/{upload_id}/parts/{part_number}:
    put:
      operationId: putMediaAttachmentMultipartPart
      tags: [Media]
      security: [{adminSession: [], csrfHeader: []}]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}, {name: upload_id, in: path, required: true, schema: {$ref: "#/components/schemas/PositiveID"}}, {name: part_number, in: path, required: true, schema: {$ref: "#/components/schemas/PositiveID"}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/MediaAttachmentUploadPartRequest"}}}}
      responses: {"204": {description: Digest-checked private part stored}, "400": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}}
  /api/admin/attachment-library/uploads/{upload_id}/complete:
    post:
      operationId: completeMediaAttachmentMultipartUpload
      tags: [Media]
      security: [{adminSession: [], csrfHeader: []}]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}, {name: upload_id, in: path, required: true, schema: {$ref: "#/components/schemas/PositiveID"}}]
      responses: {"200": {description: Private PDF promoted atomically to attachment, content: {application/json: {schema: {$ref: "#/components/schemas/MediaAttachmentUploadCompleted"}}}}, "400": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}}
  /api/admin/miniprogram-library:
    get: {operationId: listMediaMiniPrograms, tags: [Media], security: [{adminSession: []}], parameters: [{$ref: "#/components/parameters/Limit"}, {$ref: "#/components/parameters/Offset"}, {$ref: "#/components/parameters/EnabledOnly"}, {$ref: "#/components/parameters/MediaQuery"}], responses: {"200": {description: Local mini-program card page, content: {application/json: {schema: {$ref: "#/components/schemas/MediaMiniProgramListEnvelope"}}}}, "401": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}}}
    post: {operationId: createMediaMiniProgram, tags: [Media], security: [{adminSession: [], csrfHeader: []}], parameters: [{$ref: "#/components/parameters/IdempotencyKey"}], requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/MediaMiniProgramRequest"}}}}, responses: {"200": {description: Local mini-program card created, content: {application/json: {schema: {$ref: "#/components/schemas/MediaMiniProgramEnvelope"}}}}, "400": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}}}
  /api/admin/miniprogram-library/{id}:
    get: {operationId: getMediaMiniProgram, tags: [Media], security: [{adminSession: []}], parameters: [{$ref: "#/components/parameters/ID"}], responses: {"200": {description: Local mini-program card, content: {application/json: {schema: {$ref: "#/components/schemas/MediaMiniProgramEnvelope"}}}}, "401": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}}}
    put: {operationId: updateMediaMiniProgram, tags: [Media], security: [{adminSession: [], csrfHeader: []}], parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/IdempotencyKey"}], requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/MediaMiniProgramUpdateRequest"}}}}, responses: {"200": {description: Local mini-program card updated, content: {application/json: {schema: {$ref: "#/components/schemas/MediaMiniProgramEnvelope"}}}}, "400": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}}}
    delete: {operationId: deleteMediaMiniProgram, tags: [Media], security: [{adminSession: [], csrfHeader: []}], parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/IdempotencyKey"}], responses: {"200": {description: Local mini-program card deleted, content: {application/json: {schema: {$ref: "#/components/schemas/MediaDeleteEnvelope"}}}}, "403": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}}}
  /api/admin/miniprogram-library/{id}/test-resolve:
    post: {operationId: resolveLocalMiniProgramThumbnail, tags: [Media], security: [{adminSession: [], csrfHeader: []}], parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/IdempotencyKey"}], responses: {"200": {description: Local card projection refreshed without Provider call, content: {application/json: {schema: {$ref: "#/components/schemas/MediaMiniProgramResolutionEnvelope"}}}}, "403": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}}}
  /api/admin/group-invite-library:
    get: {operationId: listMediaGroupInvites, tags: [Media], security: [{adminSession: []}], parameters: [{$ref: "#/components/parameters/Limit"}, {$ref: "#/components/parameters/Offset"}, {$ref: "#/components/parameters/EnabledOnly"}, {$ref: "#/components/parameters/MediaQuery"}], responses: {"200": {description: Local group invite cards, content: {application/json: {schema: {$ref: "#/components/schemas/MediaGroupInviteListEnvelope"}}}}, "401": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}}}
    post: {operationId: createMediaGroupInvite, tags: [Media], security: [{adminSession: [], csrfHeader: []}], parameters: [{$ref: "#/components/parameters/IdempotencyKey"}], requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/MediaGroupInviteRequest"}}}}, responses: {"200": {description: Local group invite card created, content: {application/json: {schema: {$ref: "#/components/schemas/MediaGroupInviteEnvelope"}}}}, "400": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}}}
  /api/admin/group-invite-library/{id}:
    get: {operationId: getMediaGroupInvite, tags: [Media], security: [{adminSession: []}], parameters: [{$ref: "#/components/parameters/ID"}], responses: {"200": {description: Active local group invite card, content: {application/json: {schema: {$ref: "#/components/schemas/MediaGroupInviteEnvelope"}}}}, "401": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}}}
    put: {operationId: updateMediaGroupInvite, tags: [Media], security: [{adminSession: [], csrfHeader: []}], parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/IdempotencyKey"}], requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/MediaGroupInviteUpdateRequest"}}}}, responses: {"200": {description: Local group invite updated, content: {application/json: {schema: {$ref: "#/components/schemas/MediaGroupInviteEnvelope"}}}}, "400": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}}}
    delete: {operationId: archiveMediaGroupInvite, tags: [Media], security: [{adminSession: [], csrfHeader: []}], parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/IdempotencyKey"}], responses: {"200": {description: Local group invite archived without Provider call, content: {application/json: {schema: {$ref: "#/components/schemas/MediaGroupInviteArchiveEnvelope"}}}}, "403": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}}}
  /admin/customers:
    get:
      operationId: customerDirectoryPage
      security: [{adminSession: []}]
      responses:
        "200": {description: Customer activation and directory HTML, content: {text/html: {schema: {type: string}}}}
        "303": {description: Redirect to login}
  /api/admin/access/users:
    get:
      operationId: listAdminUsers
      security: [{adminSession: []}]
      responses:
        "200": {description: Employee list, content: {application/json: {schema: {type: object, required: [ok, users], properties: {ok: {const: true}, users: {type: array, items: {$ref: "#/components/schemas/AdminUser"}}}}}}}
        "403": {$ref: "#/components/responses/Error"}
    post:
      operationId: createAdminUser
      security: [{adminSession: [], csrfHeader: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CreateAdminUser"}}}}
      responses:
        "201": {description: Employee created, content: {application/json: {schema: {$ref: "#/components/schemas/AdminUser"}}}}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/admin/access/users/{id}/disable:
    post:
      operationId: disableAdminUser
      security: [{adminSession: [], csrfHeader: []}]
      parameters: [{$ref: "#/components/parameters/ID"}]
      responses: {"200": {$ref: "#/components/responses/MutationOK"}, "403": {$ref: "#/components/responses/Error"}}
  /api/admin/access/users/{id}/wecom-userid:
    post:
      operationId: bindAdminUserWeComID
      security: [{adminSession: [], csrfHeader: []}]
      parameters: [{$ref: "#/components/parameters/ID"}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [wecom_userid], properties: {wecom_userid: {type: string, maxLength: 128}}}}}}
      responses: {"200": {$ref: "#/components/responses/MutationOK"}, "403": {$ref: "#/components/responses/Error"}}
  /api/admin/access/users/{id}/roles:
    post:
      operationId: changeAdminUserRoles
      security: [{adminSession: [], csrfHeader: []}]
      parameters: [{$ref: "#/components/parameters/ID"}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [roles], properties: {roles: {$ref: "#/components/schemas/Roles"}}}}}}
      responses: {"200": {$ref: "#/components/responses/MutationOK"}, "403": {$ref: "#/components/responses/Error"}}
  /api/admin/access/users/{id}/password:
    post:
      operationId: resetAdminUserPassword
      security: [{adminSession: [], csrfHeader: []}]
      parameters: [{$ref: "#/components/parameters/ID"}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [password], properties: {password: {type: string, minLength: 12, maxLength: 1024, writeOnly: true}}}}}}
      responses: {"200": {$ref: "#/components/responses/MutationOK"}, "403": {$ref: "#/components/responses/Error"}}
  /api/admin/oneid/resolve:
    post:
      operationId: resolveOneID
      description: Read-only lookup. Never provisions and does not accept assurance.
      security: [{adminSession: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/IdentityReference"}}}}
      responses:
        "200": {description: Resolution result, content: {application/json: {schema: {$ref: "#/components/schemas/ResolveResult"}}}}
        "400": {$ref: "#/components/responses/Error"}
  /api/admin/oneid/customers/{customer_id}:
    get:
      operationId: getOneIDCustomer
      security: [{adminSession: []}]
      parameters: [{$ref: "#/components/parameters/CustomerID"}]
      responses:
        "200": {description: Customer identity summary without values or evidence, content: {application/json: {schema: {$ref: "#/components/schemas/CustomerDetail"}}}}
        "404": {$ref: "#/components/responses/Error"}
  /api/admin/oneid/conflicts:
    get:
      operationId: listOneIDConflicts
