      responses: {"202": {description: Durable local run/EER intent accepted; Provider remains disabled, content: {application/json: {schema: {$ref: "#/components/schemas/GroupOpsRunSummary"}}}}, "400": {$ref: "#/components/responses/Error"}, "401": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}, "503": {$ref: "#/components/responses/Unavailable"}}
  /api/automation/group-ops/webhooks/{webhook_key}:
