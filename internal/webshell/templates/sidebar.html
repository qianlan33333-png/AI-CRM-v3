{{define "sidebar_page"}}
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>客户侧边栏 V3 工作台</title>
  <link rel="stylesheet" href="/static/sidebar_workbench/sidebar_workbench.css?v=v3-webshell">
</head>
<body>
  <div
    class="wrap"
    id="sidebar-workbench-root"
    data-sidebar-shell-state="placeholder"
    data-debug-enabled="{{.DebugEnabled}}"
    data-workbench-url="{{.WorkbenchURL}}"
    data-profile-url="{{.ProfileURL}}"
    data-questionnaires-url="{{.QuestionnairesURL}}"
    data-products-url="{{.ProductsURL}}"
    data-orders-url="{{.OrdersURL}}"
    data-coupons-url="{{.CouponsURL}}"
    data-materials-url="{{.MaterialsURL}}"
    data-bind-mobile-url="{{.BindMobileURL}}"
    data-jssdk-config-url="{{.JSSDKConfigURL}}"
    data-context-token-url="{{.ContextTokenURL}}"
  >
    <div class="top">
      <section class="profile-card" aria-label="客户信息">
        <div class="profile-main">
          <div class="identity">
            <div class="name-row">
              <div class="name" id="customer-name">识别中</div>
              <span class="phone-state loading" id="binding-state">加载中...</span>
            </div>
            <div class="meta" id="customer-mobile"></div>
            <div class="meta" id="customer-external-userid"></div>
            <div class="workflow" id="workflow-title"></div>
          </div>
          <button class="btn change" id="change-mobile-button" type="button">换手机号</button>
        </div>
      </section>

      <nav class="tabs" id="tabs" aria-label="侧边栏模块">
        <button class="tab active" type="button" data-tab="profile">核心画像</button>
        <button class="tab" type="button" data-tab="questionnaires">问卷</button>
        <button class="tab" type="button" data-tab="products">商品</button>
        <button class="tab" type="button" data-tab="orders">订单</button>
        <button class="tab" type="button" data-tab="coupons">优惠券</button>
        <button class="tab" type="button" data-tab="materials">素材</button>
      </nav>
    </div>

    <main id="content" class="content">
      <section class="panel" data-panel="profile">
        <div class="status">正在识别当前客户…</div>
      </section>
    </main>
  </div>

  <div class="modal hidden" id="mobile-modal" role="dialog" aria-modal="true" aria-labelledby="mobile-modal-title">
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="mobile-modal-title">更换手机号</h2>
        <button class="icon-btn" id="close-mobile-modal" type="button" aria-label="关闭">×</button>
      </div>
      <label class="modal-field">
        <span>手机号</span>
        <input id="mobile-input" inputmode="numeric" autocomplete="tel" maxlength="20" placeholder="请输入 11 位手机号">
      </label>
      <div class="modal-actions">
        <button class="btn ghost" id="cancel-mobile-button" type="button">取消</button>
        <button class="btn primary" id="confirm-mobile-button" type="button">保存</button>
      </div>
      <div class="status" id="mobile-status"></div>
    </div>
  </div>

  <div class="toast hidden" id="toast" role="status" aria-live="polite"></div>
  <div id="debug-wrap" class="hidden"></div>
  <script src="/static/sidebar_workbench/sidebar_workbench.js?v=v3-webshell"></script>
</body>
</html>
{{end}}
