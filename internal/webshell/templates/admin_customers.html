{{define "admin_customers"}}
<div data-customer-directory-root
  data-customers-url="/api/admin/customers"
  data-sync-url="/api/admin/customer-sync-runs">
{{if eq .RequestPath "/admin/customers"}}
<section class="admin-card">
  <div class="admin-card-head admin-card-head--tight">
    <div><h2>客户查找</h2></div>
  </div>
  <form id="customer-list-filters" class="admin-filter-bar admin-form-grid admin-form-grid--wide-filters customer-search-form" autocomplete="off">
    <label><span>关键词</span><input type="text" name="keyword" maxlength="200" placeholder="姓名、客户编号等"></label>
    <label><span>手机号</span><input type="tel" name="phone" inputmode="numeric" maxlength="11" autocomplete="off" placeholder="客户手机号"></label>
    <label><span>客户状态</span><select name="status"><option value="">全部</option><option value="active">正常</option><option value="merged">已归并</option><option value="closed">已关闭</option></select></label>
    <div class="admin-toolbar">
      <button type="submit" class="admin-button admin-button--primary">查询</button>
      <button type="button" class="admin-button admin-button--ghost" id="customer-list-clear">清空</button>
    </div>
  </form>
  <div id="customer-page-alert" class="admin-alert" role="status" aria-live="polite" hidden></div>
</section>

<section class="admin-card">
  <div class="admin-card-head admin-card-head--tight">
    <div><h2>客户列表</h2><p id="customer-sync-summary">正在读取企微客户同步状态…</p></div>
    <div class="admin-toolbar customer-list-heading-actions">
      <div class="admin-chip admin-chip--neutral" id="customer-list-summary">正在读取客户数量</div>
      <button class="admin-button admin-button--ghost" id="customer-sync-start" type="button">重新拉取企微客户</button>
      <button class="admin-button admin-button--ghost" id="customer-list-refresh" type="button">刷新</button>
    </div>
  </div>
  <div class="customer-sync-strip" id="customer-sync-metrics" aria-live="polite"></div>
  <div id="customer-list-state" class="admin-state admin-state--inline admin-state--loading"><strong>正在加载客户</strong><span>读取 v3 客户目录。</span></div>
  <div id="customer-list-table-wrap" class="admin-table-wrap" hidden>
    <table class="admin-table">
      <thead><tr><th>客户</th><th>OneID</th><th>手机号</th><th>最后同步</th><th>操作</th></tr></thead>
      <tbody id="customer-list-body"></tbody>
    </table>
  </div>
  <div class="admin-toolbar admin-toolbar--pager customer-list-pager">
    <button class="admin-button admin-button--ghost" id="customer-prev-page" type="button" hidden>上一页</button>
    <button class="admin-button admin-button--ghost" id="customer-next-page" type="button" hidden>下一页</button>
  </div>
</section>

{{else}}
<section class="admin-card admin-module-banner" data-customer-profile-root>
  <div class="admin-card-head">
    <div><h2>客户档案</h2><p id="customer-profile-name">正在读取客户资料…</p></div>
    <a class="admin-button admin-button--ghost" href="/admin/customers">返回客户列表</a>
  </div>
  <div id="customer-detail-state" class="admin-state admin-state--inline admin-state--loading"><strong>正在加载客户档案</strong><span>读取本地客户根和安全身份摘要。</span></div>
  <div id="customer-detail-content" hidden>
    <div class="admin-profile-grid" id="customer-detail-fields"></div>
    <div class="customer-profile-meta" id="customer-profile-meta"></div>
    <div id="customer-phone-ephemeral" class="admin-alert admin-alert--success customer-phone-ephemeral" role="status" aria-live="polite" hidden></div>
  </div>
</section>

<section class="admin-split-grid admin-customer-detail-layout" id="customer-360-sections" hidden>
  <div class="admin-customer-detail-main" id="customer-360-main"></div>
  <div class="admin-customer-detail-sidebar" id="customer-360-sidebar"></div>
</section>
{{end}}
</div>
{{end}}
