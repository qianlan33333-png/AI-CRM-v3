name: Pinned free governance CLIs
description: Build fixed CLI releases with the existing Go toolchain and checksum database.
runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: go.mod
        cache: true
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: '24.18.0'
    - name: Pin npm audit without installing project dependencies
      shell: bash
      run: npm install --global npm@11.12.1 --ignore-scripts --no-audit --no-fund
    - name: Install source-pinned tools without paid Actions or SARIF services
      shell: bash
      run: python3 scripts/ci/governance_security.py install --tools-dir "$RUNNER_TEMP/governance-tools"
