name: ci

on:
  workflow_dispatch:
    inputs:
      force_full:
        description: Run all checks even when an identical merged tree has PR evidence
        type: boolean
        default: false
      hxc_full_rollout:
        description: Run HXC activation and full business acceptance (manual opt-in only)
        type: boolean
        default: false
      tag_catalog_mutation_rollout:
        description: Activate official WeCom tag catalog writes after the release is ready (manual opt-in only)
        type: boolean
        default: false
      groupops_directory_rollout:
        description: Activate WeCom staff and group directory reads without enabling message dispatch
        type: boolean
        default: false
      h5_domain_rollout:
        description: Configure www.qianlan333.cloud HTTPS and user-authorized H5 OAuth callbacks
        type: boolean
        default: false
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Preserve numbered main releases; only obsolete PR runs are cancelled.
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PR07_DONOR_DIR: ${{ github.workspace }}/.ci-donor-v2
  PR08_DONOR_DIR: ${{ github.workspace }}/.ci-donor-v2
  PR09_DONOR_ROOT: ${{ github.workspace }}/.ci-donor-v2
  AICRM_AUTOMATIONOPS_DONOR_DIR: ${{ github.workspace }}/.ci-donor-v2
  AICRM_SIDEBAR_DONOR_DIR: ${{ github.workspace }}/.ci-donor-sidebar

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      full: ${{ steps.plan.outputs.full }}
      verified_run: ${{ steps.plan.outputs.verified_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        name: Verify whether main is exactly the tested PR tree
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_FULL: ${{ inputs.force_full }}
        run: python3 scripts/ci/verification.py plan

  preflight:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '24.18.0'}
      - name: Fast source and architecture gates
        run: python3 scripts/dev_preflight.py fast --report-dir "$RUNNER_TEMP/preflight"
      - name: Verify CI evidence policy and source governance
        env:
          AICRM_DEDUP_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          AICRM_DEDUP_HEAD_SHA: ${{ github.sha }}
        run: |
          python3 -m unittest discover -s scripts/ci -p 'test_*.py'
          python3 scripts/audit/test_scan_exact_duplicates.py
          python3 scripts/audit/test_check_new_exact_duplicates.py
          python3 scripts/audit/test_check_source_authority_changes.py
          scripts/audit/check-dedup-base-diff.sh .
      - name: Verify controlled runtime configuration contracts
        run: bash scripts/test-configure-wecom-tag-catalog-mutation-runtime.sh
      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: preflight-${{ github.sha }}
          path: ${{ runner.temp }}/preflight
          retention-days: 14

  backend:
    needs: [plan, preflight]
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aicrm_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d aicrm_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AICRM_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/aicrm_ci?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
        with:
          lane: race
          donors: 'true'
      - name: Prepare browser assets required by backend fixtures
        run: bash scripts/run-donor-view-consumers.sh stage
      - name: Verify independent Excel component
        run: |
          python3 -m venv "$RUNNER_TEMP/excel-venv"
          "$RUNNER_TEMP/excel-venv/bin/pip" install -r components/excel-batches/requirements.txt
          "$RUNNER_TEMP/excel-venv/bin/python" -m unittest discover -s components/excel-batches -v
      - name: Vet all Go packages
        run: scripts/run-go-with-donor-views.sh go vet ./...
      - name: Test every Go package once with PostgreSQL and race detection
        # Includes all cmd/* importers (archive, open-platform, owner-handoff,
        # and future commands). Each job owns its database; packages stay serial.
        run: scripts/run-go-with-donor-views.sh go test -p 1 -race -count=1 ./...

  frontend:
    needs: [plan, preflight]
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
        with:
          lane: frontend
          donors: 'true'
      - name: Verify frontend, frozen contracts and final package layout
        run: |
          node scripts/excel-batches-dom-test.mjs
          node scripts/validate-openapi.mjs
          node scripts/verify-donor-sources.mjs
          node --test scripts/donor-source-views.test.mjs
          bash scripts/run-donor-view-consumers.sh check
          node scripts/media-shell-interactions-e2e.mjs
          node scripts/tags-shell-interactions-e2e.mjs
          node scripts/customer-directory-shell-e2e.mjs

  browser:
    needs: [plan, preflight]
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aicrm_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d aicrm_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AICRM_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/aicrm_ci?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
        with:
          lane: browser
          donors: 'true'
      - name: Install required Chromium fonts
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes fonts-noto-cjk
          fc-match "Noto Sans CJK SC" | rg -qi "Noto"
          command -v google-chrome
      - name: Prepare frontend inputs
        run: node scripts/generate-ai-assistant-client.mjs
      - name: Run every required Chromium journey against the staged release
        env:
          AICRM_REQUIRE_CHROMIUM_JOURNEY: '1'
          AICRM_ADMIN_LAYOUT_SCREENSHOT_DIR: ${{ github.workspace }}/artifacts/admin-shell-layout
          AICRM_SIDEBAR_SCREENSHOT_DIR: ${{ github.workspace }}/artifacts/sidebar-standard
        run: python3 scripts/dev_preflight.py browser --group all --report-dir "$RUNNER_TEMP/browser-evidence"
      - name: Upload browser results and screenshots
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: required-browser-tests-${{ github.sha }}
          path: |
            ${{ runner.temp }}/browser-evidence
            artifacts/admin-shell-layout
            artifacts/sidebar-standard
          retention-days: 14

  archive-sdk:
    needs: [plan, preflight]
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
        with:
          lane: sdk
          donors: 'false'
      - name: Verify official WeCom archive SDK ABI in isolation
        run: scripts/check-wecom-message-archive-sdk.sh

  check:
    if: always()
    needs: [plan, preflight, backend, frontend, browser, archive-sdk]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require full success or a verified identical merged tree
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/verification.py gate
      - name: Record the exact tested tree for main
        if: needs.plan.outputs.full == 'true'
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: ci-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification.json
          if-no-files-found: error
          retention-days: 30

  deploy:
    if: ${{ !cancelled() && needs.check.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    needs: check
    runs-on: ubuntu-latest
    # Cross-region upload to the mainland deployment host can make steady
    # progress for longer than 60 minutes. Keep a bounded three-hour ceiling so
    # that active chunk transfers can finish without weakening per-chunk limits.
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
        with:
          lane: release
      - name: Build the merged release without repeating PR regression tests
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: bash scripts/run-donor-view-consumers.sh release-fast
      - name: Configure pinned SSH host
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/deploy_key" >/dev/null
          test -s "$HOME/.ssh/known_hosts"
      - name: Install versioned release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          deploy/upload-release-chunks.sh \
            "aicrm-${GITHUB_SHA}.tar.gz" \
            "$GITHUB_SHA" \
            "$DEPLOY_USER" \
            "$DEPLOY_HOST" \
            "$HOME/.ssh/deploy_key"
          ssh_flags=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          remote_installer="/tmp/install-release-${GITHUB_SHA}.sh"
          scp "${ssh_flags[@]}" deploy/install-release.sh "${DEPLOY_USER}@${DEPLOY_HOST}:${remote_installer}"
          ssh "${ssh_flags[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "sudo /usr/bin/bash ${remote_installer} /tmp/aicrm-${GITHUB_SHA}.tar.gz ${GITHUB_SHA} ${GITHUB_RUN_NUMBER}"
      - name: Configure HXC production source
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          AICRM_HXC_SOURCE_DSN: ${{ secrets.AICRM_HXC_SOURCE_DSN }}
          AICRM_HXC_UNIONID_SCOPE: ${{ secrets.AICRM_HXC_UNIONID_SCOPE }}
        run: |
          set -euo pipefail
          [[ -n "$AICRM_HXC_SOURCE_DSN" && "$AICRM_HXC_SOURCE_DSN" != *[$'\r\n']* ]]
          [[ "$AICRM_HXC_UNIONID_SCOPE" == wechat-open-platform:* && "$AICRM_HXC_UNIONID_SCOPE" != *[$'\r\n']* ]]
          local_config="$RUNNER_TEMP/aicrm-hxc-${GITHUB_SHA}.env"
          remote_config="/tmp/aicrm-hxc-${GITHUB_SHA}.env"
          remote_configurer="/tmp/configure-hxc-runtime-${GITHUB_SHA}.sh"
          ssh_flags=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          cleanup() {
            rm -f -- "$local_config"
            ssh "${ssh_flags[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "rm -f -- ${remote_config} ${remote_configurer}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          umask 077
          printf 'AICRM_HXC_SYNC_ENABLED=true\nAICRM_HXC_SOURCE_DSN=%s\nAICRM_HXC_UNIONID_SCOPE=%s\nAICRM_HXC_UNIONID_VERIFIED=true\n' \
            "$AICRM_HXC_SOURCE_DSN" "$AICRM_HXC_UNIONID_SCOPE" > "$local_config"
          scp "${ssh_flags[@]}" "$local_config" "${DEPLOY_USER}@${DEPLOY_HOST}:${remote_config}"
          scp "${ssh_flags[@]}" deploy/configure-hxc-runtime.sh "${DEPLOY_USER}@${DEPLOY_HOST}:${remote_configurer}"
          ssh "${ssh_flags[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "trap 'sudo rm -f -- ${remote_config} ${remote_configurer}' EXIT; sudo /usr/bin/bash ${remote_configurer} ${remote_config} ${GITHUB_SHA}"
      - name: Run explicitly requested HXC activation and acceptance
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.hxc_full_rollout }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh_flags=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          ssh "${ssh_flags[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "sudo /usr/bin/bash /opt/aicrm/current/deploy/rollout-hxc-identity-v2.sh ${GITHUB_SHA} full"
      - name: Configure WeChat Pay H5 OAuth
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          AICRM_WECHAT_PAY_H5_APP_ID: ${{ secrets.AICRM_WECHAT_PAY_H5_APP_ID }}
          AICRM_WECHAT_PAY_H5_APP_SECRET: ${{ secrets.AICRM_WECHAT_PAY_H5_APP_SECRET }}
        run: |
          set -euo pipefail
          [[ "$AICRM_WECHAT_PAY_H5_APP_ID" =~ ^wx[0-9A-Za-z]{16}$ ]]
          [[ "$AICRM_WECHAT_PAY_H5_APP_SECRET" =~ ^[0-9A-Za-z]{32}$ ]]
          h5_scope="wechat-app:${AICRM_WECHAT_PAY_H5_APP_ID}"
          local_config="$RUNNER_TEMP/aicrm-payment-h5-${GITHUB_SHA}.env"
          remote_config="/tmp/aicrm-payment-h5-${GITHUB_SHA}.env"
          remote_configurer="/tmp/configure-payment-h5-oauth-runtime-${GITHUB_SHA}.sh"
          ssh_flags=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          cleanup() {
            rm -f -- "$local_config"
            ssh "${ssh_flags[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "rm -f -- ${remote_config} ${remote_configurer}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          umask 077
          printf 'AICRM_WECHAT_PAY_H5_OAUTH_ENABLED=true\nAICRM_WECHAT_PAY_H5_APP_ID=%s\nAICRM_WECHAT_PAY_H5_APP_SECRET=%s\nAICRM_WECHAT_PAY_H5_APP_SCOPE=%s\n' \
            "$AICRM_WECHAT_PAY_H5_APP_ID" "$AICRM_WECHAT_PAY_H5_APP_SECRET" "$h5_scope" > "$local_config"
          scp "${ssh_flags[@]}" "$local_config" "${DEPLOY_USER}@${DEPLOY_HOST}:${remote_config}"
          scp "${ssh_flags[@]}" deploy/configure-payment-h5-oauth-runtime.sh "${DEPLOY_USER}@${DEPLOY_HOST}:${remote_configurer}"
          ssh "${ssh_flags[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "trap 'sudo rm -f -- ${remote_config} ${remote_configurer}' EXIT; sudo /usr/bin/bash ${remote_configurer} ${remote_config} ${GITHUB_SHA} skip-if-provider-disabled"
      - name: Activate official WeCom tag catalog mutations
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_catalog_mutation_rollout }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          local_config="$RUNNER_TEMP/aicrm-tag-catalog-mutation-${GITHUB_SHA}.env"
          remote_config="/tmp/aicrm-tag-catalog-mutation-${GITHUB_SHA}.env"
          remote_configurer="/tmp/configure-wecom-tag-catalog-mutation-runtime-${GITHUB_SHA}.sh"
          ssh_flags=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          cleanup() {
            rm -f -- "$local_config"
            ssh "${ssh_flags[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "rm -f -- ${remote_config} ${remote_configurer}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          umask 077
          printf 'AICRM_WECOM_TAG_CATALOG_MUTATION_PROVIDER_ENABLED=true\nAICRM_WECOM_TAG_CATALOG_MUTATION_PROVIDER_PERMISSION=catalog-write-authorized\n' > "$local_config"
          scp "${ssh_flags[@]}" "$local_config" "${DEPLOY_USER}@${DEPLOY_HOST}:${remote_config}"
          scp "${ssh_flags[@]}" deploy/configure-wecom-tag-catalog-mutation-runtime.sh "${DEPLOY_USER}@${DEPLOY_HOST}:${remote_configurer}"
          ssh "${ssh_flags[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "trap 'sudo rm -f -- ${remote_config} ${remote_configurer}' EXIT; sudo /usr/bin/bash ${remote_configurer} ${remote_config} ${GITHUB_SHA}"
      - name: Activate requested Group Ops directory reads
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.groupops_directory_rollout }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          remote_script="/tmp/configure-groupops-directory-${GITHUB_SHA}.py"
          ssh_flags=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          scp "${ssh_flags[@]}" deploy/configure-groupops-directory-runtime.py "${DEPLOY_USER}@${DEPLOY_HOST}:${remote_script}"
          ssh "${ssh_flags[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "trap 'sudo rm -f -- ${remote_script}' EXIT; sudo python3 ${remote_script} ${GITHUB_SHA}"
      - name: Configure requested H5 authorization domain
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.h5_domain_rollout }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          remote_script="/tmp/configure-h5-domain-${GITHUB_SHA}.sh"
          ssh_flags=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          scp "${ssh_flags[@]}" deploy/configure-h5-domain.sh "${DEPLOY_USER}@${DEPLOY_HOST}:${remote_script}"
          ssh "${ssh_flags[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "trap 'sudo rm -f -- ${remote_script}' EXIT; sudo bash ${remote_script} ${GITHUB_SHA}"
      - name: Verify the public server is running this release
        run: python3 scripts/ci/verify_deployment.py https://id-dev.youcangogogo.com "$GITHUB_SHA"
