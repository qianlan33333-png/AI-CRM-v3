name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # GitHub keeps only one pending run per group. Give each main SHA its own
  # group so a later main push cannot replace a pending or running release;
  # non-main refs continue to share a group and supersede obsolete PR runs.
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aicrm_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aicrm_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AICRM_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/aicrm_ci?sslmode=disable
      PR07_DONOR_DIR: ${{ github.workspace }}/.ci-donor-v2
      PR09_DONOR_ROOT: ${{ github.workspace }}/.ci-donor-v2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout frozen v2 donor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: qianlan33333-png/AI-CRM-v2
          ref: 6bfbe5816bb89913c70adaca87d6a486260e016e
          path: .ci-donor-v2
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '24.18.0', cache: npm}
      - name: Pin frozen donor npm
        run: npm install --global npm@11.12.1
      - name: Build and stage frozen External Effects workspace
        env:
          PR08_DONOR_DIR: ${{ github.workspace }}/.ci-donor-v2
        run: |
          npm ci
          npm run version:check
          node scripts/validate-openapi.mjs
          scripts/check-pr01-donor-manifest.sh
          scripts/check-pr02-donor-manifest.sh
          scripts/check-pr03-frontend-donor-manifest.sh
          donor_dir="$(mktemp -d)"
          git clone --quiet https://github.com/qianlan33333-png/AI-CRM-v2.git "$donor_dir"
          git -C "$donor_dir" checkout --quiet 6bfbe5816bb89913c70adaca87d6a486260e016e
          AICRM_SURVEY_DONOR_DIR="$donor_dir" scripts/check-survey-donor-manifest.sh
          AICRM_PR06_DONOR_DIR="$donor_dir" scripts/check-pr06-closure.sh
          rm -rf "$donor_dir"
          scripts/check-pr07-frontend-freeze.sh
          node web/scripts/survey-editor-characterization.mjs
          node web/scripts/survey-public-characterization.mjs
          node web/scripts/survey-unresolved-history-contract.mjs
          node --check internal/webshell/static/admin_console/survey_operations.js
          scripts/check-pr08-frontend-donor-manifest.sh
          scripts/check-pr09-frontend-freeze.sh
          npm run typecheck
          npx tsc -p web/v3/tsconfig.json --noEmit
          npm test
          npm run build
          node scripts/build-v3-host-adapters.mjs
          node scripts/operation-cycles-shell-e2e.mjs
          mkdir -p release
          node scripts/stage-pr01-effects-ui.mjs web/dist release/web/dist
          node scripts/test-stage-pr01-effects-ui.mjs
          node scripts/test-groupops-history-release.mjs web/dist release/web/dist
          node scripts/stage-survey-ui.mjs web/dist release/web/dist
          node scripts/test-stage-survey-ui.mjs web/dist release/web/dist
          scripts/check-install-release-contract.sh
      - name: Verify Media shell donor interactions
        run: node scripts/media-shell-interactions-e2e.mjs
      - name: Verify Tags shell donor interactions
        run: node scripts/tags-shell-interactions-e2e.mjs
      - name: Verify customer directory shell interactions
        run: node scripts/customer-directory-shell-e2e.mjs
      - name: Check repository
        run: make check
      - name: Race-check security and identity boundaries
        run: go test -race ./cmd/aicrm ./cmd/migrate-commerce-history ./internal/access/... ./internal/identity/... ./internal/wecom/... ./internal/externaleffects/... ./internal/platform/jobqueue/... ./internal/media/... ./internal/tag/... ./internal/product/... ./internal/coupon/... ./internal/groupops/... ./internal/automation/... ./internal/operationcycle/... ./internal/outbound ./internal/order/... ./internal/payment/... ./internal/config/... ./internal/adminops/... ./internal/release/...

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    # Cross-region upload to the mainland deployment host can exceed 30 minutes.
    # Keep a bounded 60-minute margin so a slow transfer is not cancelled after
    # all server-side checks pass.
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      PR07_DONOR_DIR: ${{ github.workspace }}/.ci-donor-v2
      PR09_DONOR_ROOT: ${{ github.workspace }}/.ci-donor-v2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout frozen v2 donor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: qianlan33333-png/AI-CRM-v2
          ref: 6bfbe5816bb89913c70adaca87d6a486260e016e
          path: .ci-donor-v2
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '24.18.0', cache: npm}
      - name: Pin frozen donor npm
        run: npm install --global npm@11.12.1
      - name: Build release artifact
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
          PR08_DONOR_DIR: ${{ github.workspace }}/.ci-donor-v2
        run: |
          set -euo pipefail
          mkdir -p release/bin
          go build -trimpath -ldflags "-s -w" -o release/bin/aicrm ./cmd/aicrm
          go build -trimpath -ldflags "-s -w" -o release/bin/migrate-platform ./cmd/migrate-platform
          go build -trimpath -ldflags "-s -w" -o release/bin/migrate-river ./cmd/migrate-river
          go build -trimpath -ldflags "-s -w" -o release/bin/migrate-phone-identities ./cmd/migrate-phone-identities
          go build -trimpath -ldflags "-s -w" -o release/bin/migrate-survey-v2 ./cmd/migrate-survey-v2
          go build -trimpath -ldflags "-s -w" -o release/bin/migrate-commerce-history ./cmd/migrate-commerce-history
          go build -trimpath -ldflags "-s -w" -o release/bin/migrate-automation-operations ./cmd/migrate-automation-operations
          npm ci
          npm run version:check
          node scripts/validate-openapi.mjs
          scripts/check-pr01-donor-manifest.sh
          scripts/check-pr02-donor-manifest.sh
          scripts/check-pr03-frontend-donor-manifest.sh
          scripts/check-survey-donor-manifest.sh
          node web/scripts/survey-editor-characterization.mjs
          node web/scripts/survey-public-characterization.mjs
          node web/scripts/survey-unresolved-history-contract.mjs
          node --check internal/webshell/static/admin_console/survey_operations.js
          scripts/check-pr08-frontend-donor-manifest.sh
          scripts/check-pr09-frontend-freeze.sh
          npm run typecheck
          npx tsc -p web/v3/tsconfig.json --noEmit
          npm run build
          node scripts/build-v3-host-adapters.mjs
          node scripts/operation-cycles-shell-e2e.mjs
          cp -R migrations deploy release/
          node scripts/stage-pr01-effects-ui.mjs web/dist release/web/dist
          node scripts/test-stage-pr01-effects-ui.mjs
          node scripts/test-groupops-history-release.mjs web/dist release/web/dist
          node scripts/stage-survey-ui.mjs web/dist release/web/dist
          node scripts/test-stage-survey-ui.mjs web/dist release/web/dist
          (
            cd release
            LC_ALL=C find . -type f ! -name release-files.sha256 -print0 \
              | sort -z \
              | xargs -0 sha256sum > release-files.sha256
            sha256sum --strict --check release-files.sha256
          )
          tar -C release -czf "aicrm-${GITHUB_SHA}.tar.gz" .
      - name: Configure pinned SSH host
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/deploy_key" >/dev/null
          test -s "$HOME/.ssh/known_hosts"
      - name: Install versioned release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh_flags=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          remote_installer="/tmp/install-release-${GITHUB_SHA}.sh"
          scp "${ssh_flags[@]}" "aicrm-${GITHUB_SHA}.tar.gz" "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/"
          scp "${ssh_flags[@]}" deploy/install-release.sh "${DEPLOY_USER}@${DEPLOY_HOST}:${remote_installer}"
          ssh "${ssh_flags[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "sudo /usr/bin/bash ${remote_installer} /tmp/aicrm-${GITHUB_SHA}.tar.gz ${GITHUB_SHA} ${GITHUB_RUN_NUMBER}"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 https://id-dev.youcangogogo.com/readyz
