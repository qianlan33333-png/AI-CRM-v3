name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aicrm_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aicrm_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AICRM_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/aicrm_ci?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '24.18.0', cache: npm}
      - name: Pin frozen donor npm
        run: npm install --global npm@11.12.1
      - name: Build and stage frozen External Effects workspace
        run: |
          npm ci
          npm run version:check
          node scripts/validate-openapi.mjs
          scripts/check-pr01-donor-manifest.sh
          scripts/check-pr02-donor-manifest.sh
          scripts/check-pr03-frontend-donor-manifest.sh
          npm run typecheck
          npm test
          npm run build
          mkdir -p release
          node scripts/stage-pr01-effects-ui.mjs web/dist release/web/dist
          node scripts/test-stage-pr01-effects-ui.mjs
          scripts/check-install-release-contract.sh
      - name: Verify Media shell donor interactions
        run: node scripts/media-shell-interactions-e2e.mjs
      - name: Check repository
        run: make check
      - name: Race-check security and identity boundaries
        run: go test -race ./cmd/aicrm ./internal/access/... ./internal/identity/... ./internal/wecom/... ./internal/externaleffects/... ./internal/platform/jobqueue/... ./internal/media/... ./internal/tag/... ./internal/outbound

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    # The GitHub-hosted runner can need 10-15 minutes to upload the release to
    # the mainland deployment host. Keep a bounded margin so a slow transfer
    # is not reported as a failed install after all server-side checks pass.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '24.18.0', cache: npm}
      - name: Pin frozen donor npm
        run: npm install --global npm@11.12.1
      - name: Build release artifact
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail
          mkdir -p release/bin
          go build -trimpath -ldflags "-s -w" -o release/bin/aicrm ./cmd/aicrm
          go build -trimpath -ldflags "-s -w" -o release/bin/migrate-platform ./cmd/migrate-platform
          go build -trimpath -ldflags "-s -w" -o release/bin/migrate-river ./cmd/migrate-river
          npm ci
          npm run version:check
          node scripts/validate-openapi.mjs
          scripts/check-pr01-donor-manifest.sh
          scripts/check-pr02-donor-manifest.sh
          scripts/check-pr03-frontend-donor-manifest.sh
          npm run typecheck
          npm run build
          cp -R migrations deploy release/
          node scripts/stage-pr01-effects-ui.mjs web/dist release/web/dist
          node scripts/test-stage-pr01-effects-ui.mjs
          tar -C release -czf "aicrm-${GITHUB_SHA}.tar.gz" .
      - name: Configure pinned SSH host
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/deploy_key" >/dev/null
          test -s "$HOME/.ssh/known_hosts"
      - name: Install versioned release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh_flags=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          scp "${ssh_flags[@]}" "aicrm-${GITHUB_SHA}.tar.gz" deploy/install-release.sh "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/"
          ssh "${ssh_flags[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "sudo /usr/bin/bash /tmp/install-release.sh /tmp/aicrm-${GITHUB_SHA}.tar.gz ${GITHUB_SHA}"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 https://id-dev.youcangogogo.com/readyz
