components:
  securitySchemes:
    adminSession: {type: apiKey, in: cookie, name: aicrm_admin_session}
    sidebarSession: {type: apiKey, in: cookie, name: aicrm_sidebar_session}
    csrfHeader: {type: apiKey, in: header, name: X-CSRF-Token}
    contextToken: {type: http, scheme: bearer}
    groupOpsWebhook: {type: apiKey, in: header, name: X-AICRM-Signature}
    paymentSession: {type: apiKey, in: cookie, name: aicrm_payment_session}
    wechatPaySignature: {type: apiKey, in: header, name: Wechatpay-Signature}
    operationCycleService: {type: http, scheme: bearer}
    automationOpsWebhook: {type: apiKey, in: header, name: X-AICRM-Signature, description: HMAC-SHA256 over the exact body and versioned timestamp/event context.}
    aiAssistantIntegration: {type: apiKey, in: header, name: X-AICRM-Integration-Key}
  parameters:
    ID: {name: id, in: path, required: true, schema: {$ref: "#/components/schemas/PositiveID"}}
    RadarID: {name: radar_id, in: path, required: true, schema: {$ref: "#/components/schemas/PositiveID"}}
    RadarCode: {name: code, in: path, required: true, schema: {type: string, pattern: "^rd_[A-Za-z0-9_-]{16,64}$"}}
    AutomationAgentID: {name: agent_id, in: path, required: true, schema: {$ref: "#/components/schemas/PositiveID"}}
    ProductID: {name: product_id, in: path, required: true, schema: {$ref: "#/components/schemas/PositiveID"}}
    ServiceProductID: {name: service_product_id, in: path, required: true, schema: {$ref: "#/components/schemas/PositiveID"}}
    TagID: {name: tag_id, in: path, required: true, schema: {$ref: "#/components/schemas/PositiveID"}}
    TagGroupID: {name: group_id, in: path, required: true, schema: {$ref: "#/components/schemas/PositiveID"}}
    ExternalEffectID: {name: id, in: path, required: true, schema: {$ref: "#/components/schemas/ExternalEffectID"}}
    PushJobID: {name: job_id, in: path, required: true, schema: {$ref: "#/components/schemas/PositiveID"}}
    ExternalEffectsView: {name: view, in: query, required: true, schema: {type: string, const: external-effects}}
    PushJobQuery: {name: job, in: query, schema: {$ref: "#/components/schemas/PositiveID"}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: false, description: Explicit keys replay or reject payload drift. Frozen v2 Media controls omit this header; the compatibility adapter mints and audits a fresh per-request key., schema: {type: string, minLength: 1, maxLength: 200}}
    MediaImageCategory: {name: category, in: query, schema: {type: string, maxLength: 64}}
    MediaQuery: {name: q, in: query, schema: {type: string, maxLength: 200}}
    EnabledOnly: {name: enabled_only, in: query, schema: {type: boolean, default: true}}
    ImageTags: {name: tags, in: query, schema: {type: string, maxLength: 4096, description: Comma-separated intersection tag filter.}}
    ImageTagGroup: {name: tag_group, in: query, schema: {type: string, maxLength: 4096, description: Repeatable comma-separated tag group filter.}}
    OnlyUnlabeled: {name: only_unlabeled, in: query, schema: {type: boolean, default: false}}
    IncludeData: {name: include_data, in: query, schema: {type: boolean, default: false}}
    MediaImageDetailVariant: {name: variant, in: query, schema: {type: string, enum: [thumb_160, thumb_320, mobile_1080, large_1440, original]}}
    CustomerID: {name: customer_id, in: path, required: true, schema: {$ref: "#/components/schemas/PositiveID"}}
    SafeNext: {name: next, in: query, schema: {type: string, pattern: "^/"}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
    ProductLimit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
    ProductOffset: {name: offset, in: query, schema: {type: integer, minimum: 0, maximum: 1000000, default: 0}}
    MediaLimit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 50}}
    Offset: {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
    BeforeID: {name: before_id, in: query, schema: {type: integer, format: int64, minimum: 1}}
    ReceiptID: {name: receipt_id, in: path, required: true, schema: {$ref: "#/components/schemas/PositiveID"}}
    MessageSignature: {name: msg_signature, in: query, required: true, schema: {type: string}}
    Timestamp: {name: timestamp, in: query, required: true, schema: {type: string, pattern: "^[0-9]+$"}}
    Nonce: {name: nonce, in: query, required: true, schema: {type: string}}
    RequiredIdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 200}}
    AdminAccessIdempotencyKey: {name: Idempotency-Key, in: header, required: true, description: Stable local admin-access request key. Repeating the same desired flags does not create another session-version change., schema: {type: string, minLength: 1, maxLength: 200}}
    GroupOpsPlanID: {name: plan_id, in: path, required: true, schema: {$ref: "#/components/schemas/PositiveID"}}
    GroupOpsStaffID: {name: staff_id, in: path, required: true, schema: {$ref: "#/components/schemas/PositiveID"}}
    GroupOpsAssetReference: {name: asset_reference, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9._:-]{1,128}$"}}
    GroupOpsChatID: {name: chat_id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9._:-]{1,128}$"}}
    GroupOpsNodeID: {name: node_id, in: path, required: true, schema: {$ref: "#/components/schemas/PositiveID"}}
    GroupOpsExecutionID: {name: execution_id, in: path, required: true, schema: {$ref: "#/components/schemas/PositiveID"}}
    GroupOpsWebhookKey: {name: webhook_key, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9._:-]{1,128}$"}}
    GroupOpsWebhookClientID: {name: X-AICRM-Client-Id, in: header, required: true, schema: {type: string, const: aicrm-webhook-group-ops}}
    GroupOpsWebhookTimestamp: {name: X-AICRM-Timestamp, in: header, required: true, schema: {type: string, pattern: "^[0-9]{1,20}$"}}
    GroupOpsWebhookEventID: {name: X-AICRM-Event-Id, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 256}}
    GroupOpsWebhookSignature: {name: X-AICRM-Signature, in: header, required: true, schema: {type: string, pattern: "^[0-9a-fA-F]{64}$"}}
    OrderReference: {name: order_ref, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
    AutomationOpsGroupID: {name: group_id, in: path, required: true, schema: {$ref: "#/components/schemas/PositiveID"}}
    AutomationOpsPackageID: {name: package_id, in: path, required: true, schema: {$ref: "#/components/schemas/PositiveID"}}
    AutomationOpsRefreshRunID: {name: refresh_run_id, in: path, required: true, schema: {$ref: "#/components/schemas/PositiveID"}}
    AutomationOpsPolicyID: {name: policy_id, in: path, required: true, schema: {$ref: "#/components/schemas/PositiveID"}}
    AutomationOpsRunID: {name: run_id, in: path, required: true, schema: {$ref: "#/components/schemas/PositiveID"}}
    AutomationOpsEffectID: {name: effect_id, in: path, required: true, schema: {type: string, pattern: "^eej_v1_[A-Za-z0-9_-]{22,128}$"}}
    AutomationOpsPackageKey: {name: package_key, in: path, required: true, schema: {type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,119}$"}}
    AutomationOpsPackageAction: {name: package_action, in: path, required: true, schema: {type: string, enum: [pause, activate]}}
    AutomationOpsLifecycleAction: {name: lifecycle_action, in: path, required: true, schema: {type: string, enum: [activate, pause, archive]}}
    AutomationOpsSnapshotQuery: {name: snapshot_id, in: query, required: true, schema: {$ref: "#/components/schemas/PositiveID"}}
    ExpectedVersion: {name: expected_version, in: query, required: true, schema: {type: integer, format: int64, minimum: 1}}
    Cursor: {name: cursor, in: query, schema: {type: string, maxLength: 512}}
    AutomationOpsWebhookTimestamp: {name: X-AICRM-Timestamp, in: header, required: true, schema: {type: string, pattern: "^[0-9]{1,20}$"}}
    AutomationOpsWebhookEventID: {name: X-AICRM-Event-Id, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
    AIAssistantPlanID: {name: plan_id, in: path, required: true, schema: {$ref: "#/components/schemas/PositiveID"}}
    AIAssistantRecipientID: {name: recipient_id, in: path, required: true, schema: {$ref: "#/components/schemas/PositiveID"}}
    AIAssistantEffectID: {name: effect_id, in: path, required: true, schema: {type: string, pattern: "^eer_[1-9][0-9]*$"}}
    AIAssistantCursor: {name: cursor, in: query, schema: {type: string, maxLength: 512}}
    AIAssistantLimit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 50}}
    AIAssistantIntegrationTimestamp: {name: X-AICRM-Timestamp, in: header, required: true, schema: {type: string, pattern: "^[0-9]{1,20}$"}}
    AIAssistantIntegrationNonce: {name: X-AICRM-Nonce, in: header, required: true, schema: {type: string, minLength: 16, maxLength: 128}}
    AIAssistantIntegrationSignature: {name: X-AICRM-Signature, in: header, required: true, schema: {type: string, pattern: "^[0-9a-f]{64}$"}}
  responses:
    Error: {description: Stable error response, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
    Unavailable: {description: Dependency or provider unavailable, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
    MutationOK: {description: Mutation completed, content: {application/json: {schema: {type: object, required: [ok], properties: {ok: {const: true}}}}}}
  schemas:
    RadarLink:
      type: object
      additionalProperties: false
      required: [link_id, public_code, name, title, destination_url, status, version, created_by, updated_by, created_at, updated_at, auth_policy]
      properties:
        link_id: {$ref: "#/components/schemas/PositiveID"}
        public_code: {type: string, pattern: "^rd_[A-Za-z0-9_-]{16,64}$"}
        name: {type: string, minLength: 1, maxLength: 120}
        title: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 2000}
        destination_url: {type: string, format: uri, pattern: "^https://"}
        cover_image_id: {oneOf: [{$ref: "#/components/schemas/PositiveID"}, {type: "null"}]}
        attachment_id: {oneOf: [{$ref: "#/components/schemas/PositiveID"}, {type: "null"}]}
        auth_policy: {type: string, enum: [anonymous, unionid_required]}
        status: {type: string, enum: [draft, enabled, disabled]}
        version: {type: integer, format: int64, minimum: 1}
        created_by: {$ref: "#/components/schemas/PositiveID"}
        updated_by: {$ref: "#/components/schemas/PositiveID"}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    RadarLinkEnvelope:
      type: object
      additionalProperties: false
      required: [link, local_projection, real_external_call_executed]
      properties: {link: {$ref: "#/components/schemas/RadarLink"}, local_projection: {const: true}, real_external_call_executed: {const: false}}
    RadarLinkPage:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset, has_more, local_projection, real_external_call_executed]
      properties:
        items: {type: array, maxItems: 100, items: {$ref: "#/components/schemas/RadarLink"}}
        total: {type: integer, format: int64, minimum: 0}
        limit: {type: integer, minimum: 1, maximum: 100}
        offset: {type: integer, minimum: 0}
        has_more: {type: boolean}
        status_filter: {type: string, enum: [all, draft, enabled, disabled]}
        sort: {type: string, enum: [updated_desc, created_desc, name_asc]}
        local_projection: {const: true}
        real_external_call_executed: {const: false}
    RadarLinkMutation:
      type: object
      additionalProperties: false
      required: [expected_version, name, title, destination_url]
      properties:
        expected_version: {type: integer, format: int64, minimum: 0}
        name: {type: string, minLength: 1, maxLength: 120}
        title: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 2000}
        destination_url: {type: string, format: uri, pattern: "^https://"}
        cover_image_id: {oneOf: [{$ref: "#/components/schemas/PositiveID"}, {type: "null"}]}
        attachment_id: {oneOf: [{$ref: "#/components/schemas/PositiveID"}, {type: "null"}]}
        auth_policy: {type: string, enum: [anonymous, unionid_required], default: unionid_required}
    RadarVersionRequest:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties: {expected_version: {type: integer, format: int64, minimum: 1}}
    RadarStats:
      type: object
      additionalProperties: true
      required: [link_id, total_events, total_landings, authorized_users, view_opens]
      properties:
        link_id: {$ref: "#/components/schemas/PositiveID"}
        total_events: {type: integer, format: int64, minimum: 0}
        total_landings: {type: integer, format: int64, minimum: 0}
        authorized_users: {type: integer, format: int64, minimum: 0}
        view_opens: {type: integer, format: int64, minimum: 0}
        last_clicked_at: {oneOf: [{type: string, format: date-time}, {type: "null"}]}
    RadarEvent:
      type: object
      additionalProperties: false
      required: [receipt_id, link_id, stage, source, created_at]
      properties:
        event_id: {$ref: "#/components/schemas/PositiveID"}
        receipt_id: {type: string, pattern: "^rre_[0-9a-f]{32}$"}
        link_id: {$ref: "#/components/schemas/PositiveID"}
        stage: {type: string, enum: [landing, oauth_started, oauth_verified, identity_resolved, content_opened, redirected, image_loaded, pdf_opened, failed]}
        source: {type: string, enum: [public_event]}
        created_at: {type: string, format: date-time}
    RadarEventPage:
      type: object
      additionalProperties: true
      required: [items, total, limit, offset, has_more, identity_attributed, real_external_call_executed]
      properties:
        items: {type: array, maxItems: 500, items: {$ref: "#/components/schemas/RadarEvent"}}
        total: {type: integer, format: int64, minimum: 0}
        limit: {type: integer, minimum: 1, maximum: 500}
        offset: {type: integer, minimum: 0}
        has_more: {type: boolean}
        identity_attributed: {const: false}
        real_external_call_executed: {const: false}
    RadarPublicEventRequest:
      type: object
      additionalProperties: false
      required: [stage, event_token]
      properties: {stage: {type: string, enum: [image_loaded, pdf_opened]}, page: {type: integer, minimum: 1, maximum: 100000}, event_token: {type: string, minLength: 43, maxLength: 43}}
    AutomationOpsDigest: {type: string, pattern: "^[0-9a-f]{64}$"}
    AutomationOpsGroup: {type: object, additionalProperties: false, required: [id, name, sort_order, version], properties: {id: {$ref: "#/components/schemas/PositiveID"}, name: {type: string, minLength: 1, maxLength: 100}, sort_order: {type: integer, minimum: 0}, version: {type: integer, format: int64, minimum: 1}}}
    AutomationOpsGroupList: {type: object, additionalProperties: false, required: [items], properties: {items: {type: array, maxItems: 1000, items: {$ref: "#/components/schemas/AutomationOpsGroup"}}}}
    AutomationOpsGroupEnvelope: {type: object, additionalProperties: false, required: [group], properties: {group: {$ref: "#/components/schemas/AutomationOpsGroup"}}}
    AutomationOpsGroupMutation: {type: object, additionalProperties: false, required: [name], properties: {name: {type: string, minLength: 1, maxLength: 100}, sort_order: {type: integer, minimum: 0}, expected_version: {type: integer, format: int64, minimum: 1}}}
    AutomationOpsPackage: {type: object, additionalProperties: false, required: [id, code, name, lifecycle, version, readiness], properties: {id: {$ref: "#/components/schemas/PositiveID"}, group_id: {$ref: "#/components/schemas/PositiveID"}, code: {type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,119}$"}, name: {type: string, minLength: 1, maxLength: 200}, lifecycle: {type: string, enum: [paused, active, archived]}, version: {type: integer, format: int64, minimum: 1}, configuration_version_id: {$ref: "#/components/schemas/PositiveID"}, published_snapshot_id: {$ref: "#/components/schemas/PositiveID"}, automation_binding_id: {$ref: "#/components/schemas/PositiveID"}, sender_set_id: {$ref: "#/components/schemas/PositiveID"}, member_count: {type: integer, format: int64, minimum: 0, maximum: 100000}, reference_time: {type: string, format: date-time}, published_at: {type: string, format: date-time}, readiness: {type: string, enum: [not_ready, ready, stale, disabled]}}}
