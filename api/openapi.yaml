openapi: 3.1.0
info:
  title: AI-CRM v3 Foundation API
  version: 0.4.0
  description: OneID, employee access, WeCom foundation and durable external-contact callback contract. Unimplemented CRM menus expose HTML placeholders and no business API.
servers:
  - url: https://id-dev.youcangogogo.com
paths:
  /healthz:
    get:
      operationId: getHealth
      responses:
        "200": {description: Process is alive, content: {application/json: {schema: {$ref: "#/components/schemas/StatusResponse"}}}}
  /readyz:
    get:
      operationId: getReadiness
      responses:
        "200": {description: PostgreSQL and migrations are ready, content: {application/json: {schema: {$ref: "#/components/schemas/StatusResponse"}}}}
        "503": {$ref: "#/components/responses/Unavailable"}
  /login:
    get:
      operationId: loginPage
      parameters: [{$ref: "#/components/parameters/SafeNext"}]
      responses:
        "200": {description: Login HTML, content: {text/html: {schema: {type: string}}}}
    post:
      operationId: passwordLogin
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded: {schema: {$ref: "#/components/schemas/LoginRequest"}}
          application/json: {schema: {$ref: "#/components/schemas/LoginRequest"}}
      responses:
        "200": {description: JSON login result and Secure cookies, content: {application/json: {schema: {$ref: "#/components/schemas/LoginResponse"}}}}
        "303": {description: Browser redirect after successful login}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /logout:
    post:
      operationId: logout
      security: [{adminSession: [], csrfHeader: []}]
      responses:
        "200": {$ref: "#/components/responses/MutationOK"}
        "303": {description: Browser redirect to login}
        "403": {$ref: "#/components/responses/Error"}
  /auth/wecom/start:
    get:
      operationId: startAdminWeComOAuth
      parameters:
        - {$ref: "#/components/parameters/SafeNext"}
        - {name: mode, in: query, schema: {type: string, enum: [qr, oauth], default: qr}}
      responses:
        "302": {description: Redirect to WeCom authorization}
        "400": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /auth/wecom/callback:
    get:
      operationId: completeAdminWeComOAuth
      parameters:
        - {name: state, in: query, required: true, schema: {type: string}}
        - {name: code, in: query, required: true, schema: {type: string}}
      responses:
        "302": {description: Secure admin session issued}
        "400": {$ref: "#/components/responses/Error"}
  /admin/config/login-access:
    get:
      operationId: employeeAccessPage
      security: [{adminSession: []}]
      responses:
        "200": {description: Employee access HTML, content: {text/html: {schema: {type: string}}}}
        "303": {description: Redirect to login}
  /admin/oneid:
    get:
      operationId: oneIDAdministrationPage
      security: [{adminSession: []}]
      responses:
        "200": {description: OneID read-only administration HTML, content: {text/html: {schema: {type: string}}}}
        "303": {description: Redirect to login}
  /admin/external-effects:
    get:
      operationId: openExternalEffectsWorkspace
      description: Stable v3 entrypoint. It redirects to the frozen donor URL alias so unchanged donor navigation and job detail links continue to work.
      security: [{adminSession: []}]
      parameters: [{$ref: "#/components/parameters/ExternalEffectsView"}, {$ref: "#/components/parameters/PushJobQuery"}]
      responses:
        "303": {description: "Redirect to /admin/campaigns.html?view=external-effects, preserving a valid job query."}
        "403": {$ref: "#/components/responses/Error"}
  /admin/campaigns.html:
    get:
      operationId: externalEffectsDonorURLAlias
      description: Compatibility alias for the frozen donor runtime. Only view=external-effects and an optional positive job are served; no Campaign capability is exposed.
      security: [{adminSession: []}]
      parameters: [{$ref: "#/components/parameters/ExternalEffectsView"}, {$ref: "#/components/parameters/PushJobQuery"}]
      responses:
        "200": {description: v3 admin shell with the frozen External Effects stage mount, content: {text/html: {schema: {type: string}}}}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /admin/image-library:
    get:
      operationId: openImageLibraryWorkspace
      security: [{adminSession: []}]
      responses: {"200": {description: v3 shell with frozen image-library donor template}, "403": {$ref: "#/components/responses/Error"}}
  /admin/miniprogram-library:
    get:
      operationId: openMiniProgramLibraryWorkspace
      security: [{adminSession: []}]
      responses: {"200": {description: v3 shell with frozen mini-program donor template}, "403": {$ref: "#/components/responses/Error"}}
  /admin/attachment-library:
    get:
      operationId: openAttachmentLibraryWorkspace
      security: [{adminSession: []}]
      responses: {"200": {description: v3 shell with frozen attachment donor template}, "403": {$ref: "#/components/responses/Error"}}
  /api/admin/image-library:
    get:
      operationId: listMediaImages
      security: [{adminSession: []}]
      parameters: [{$ref: "#/components/parameters/Limit"}, {$ref: "#/components/parameters/Offset"}]
      responses: {"200": {description: Local image page}, "403": {$ref: "#/components/responses/Error"}}
    post:
      operationId: createMediaImage
      security: [{adminSession: [], csrfHeader: []}]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {multipart/form-data: {schema: {type: object, required: [image], properties: {image: {type: string, format: binary}, name: {type: string}, description: {type: string}, tags: {type: string}, category: {type: string}}}}}}
      responses: {"200": {description: Local image created}, "400": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}}
  /api/admin/image-library/{id}:
    get:
      operationId: getMediaImage
      security: [{adminSession: []}]
      parameters: [{$ref: "#/components/parameters/ID"}]
      responses: {"200": {description: Local image metadata}, "404": {$ref: "#/components/responses/Error"}}
    put:
      operationId: updateMediaImage
      security: [{adminSession: [], csrfHeader: []}]
      parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses: {"200": {description: Local image updated}, "403": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}}
    delete:
      operationId: deleteMediaImage
      security: [{adminSession: [], csrfHeader: []}]
      parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      responses: {"200": {description: Image deleted when unreferenced}, "409": {$ref: "#/components/responses/Error"}}
  /api/admin/image-library/{id}/variants/{variant}:
    get:
      operationId: getMediaImageVariant
      security: [{adminSession: []}]
      parameters: [{$ref: "#/components/parameters/ID"}, {name: variant, in: path, required: true, schema: {type: string, enum: [thumb_160, thumb_320, mobile_1080, large_1440, original]}}]
      responses: {"200": {description: Authenticated image bytes}, "304": {description: ETag matched}, "404": {$ref: "#/components/responses/Error"}}
  /api/admin/image-library/upload:
    post:
      operationId: uploadLegacyMediaImage
      description: Frozen Media multipart compatibility alias. Missing Idempotency-Key receives an audited server compatibility key.
      security: [{adminSession: [], csrfHeader: []}]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {multipart/form-data: {schema: {type: object, required: [image], properties: {image: {type: string, format: binary}}}}}}
      responses: {"200": {description: Local image created}, "400": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}}
  /api/admin/attachment-library:
    get:
      operationId: listMediaAttachments
      security: [{adminSession: []}]
      responses: {"200": {description: Local private attachment page}}
    post:
      operationId: createMediaAttachment
      security: [{adminSession: [], csrfHeader: []}]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {multipart/form-data: {schema: {type: object, required: [attachment], properties: {attachment: {type: string, format: binary}, name: {type: string}, tags: {type: string}}}}}}
      responses: {"200": {description: Local PDF attached}, "400": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}}
  /api/admin/attachment-library/{id}:
    get: {operationId: getMediaAttachment, security: [{adminSession: []}], parameters: [{$ref: "#/components/parameters/ID"}], responses: {"200": {description: Attachment metadata}, "404": {$ref: "#/components/responses/Error"}}}
    put: {operationId: updateMediaAttachment, security: [{adminSession: [], csrfHeader: []}], parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/IdempotencyKey"}], responses: {"200": {description: CAS metadata updated}, "409": {$ref: "#/components/responses/Error"}}}
    delete: {operationId: deleteMediaAttachment, security: [{adminSession: [], csrfHeader: []}], parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/IdempotencyKey"}], responses: {"200": {description: Attachment deleted when unreferenced}, "409": {$ref: "#/components/responses/Error"}}}
  /api/admin/attachment-library/{id}/download:
    get: {operationId: downloadMediaAttachment, security: [{adminSession: []}], parameters: [{$ref: "#/components/parameters/ID"}], responses: {"200": {description: Authenticated PDF bytes}, "404": {$ref: "#/components/responses/Error"}}}
  /api/admin/attachment-library/upload:
    post: {operationId: uploadLegacyMediaAttachment, security: [{adminSession: [], csrfHeader: []}], parameters: [{$ref: "#/components/parameters/IdempotencyKey"}], responses: {"200": {description: Local PDF uploaded}}}
  /api/admin/attachment-library/uploads:
    post:
      operationId: initiateMediaAttachmentMultipartUpload
      security: [{adminSession: [], csrfHeader: []}]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/MediaAttachmentUploadInitiateRequest"}}}}
      responses: {"201": {description: Private upload reserved}, "400": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}}
  /api/admin/attachment-library/uploads/{upload_id}/parts/{part_number}:
    put:
      operationId: putMediaAttachmentMultipartPart
      security: [{adminSession: [], csrfHeader: []}]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}, {name: upload_id, in: path, required: true, schema: {$ref: "#/components/schemas/PositiveID"}}, {name: part_number, in: path, required: true, schema: {$ref: "#/components/schemas/PositiveID"}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/MediaAttachmentUploadPartRequest"}}}}
      responses: {"204": {description: Digest-checked private part stored}, "400": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}}
  /api/admin/attachment-library/uploads/{upload_id}/complete:
    post:
      operationId: completeMediaAttachmentMultipartUpload
      security: [{adminSession: [], csrfHeader: []}]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}, {name: upload_id, in: path, required: true, schema: {$ref: "#/components/schemas/PositiveID"}}]
      responses: {"200": {description: Private PDF promoted atomically to attachment}, "400": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}}
  /api/admin/miniprogram-library:
    get: {operationId: listMediaMiniPrograms, security: [{adminSession: []}], responses: {"200": {description: Local mini-program card page}}}
    post: {operationId: createMediaMiniProgram, security: [{adminSession: [], csrfHeader: []}], parameters: [{$ref: "#/components/parameters/IdempotencyKey"}], requestBody: {required: true, content: {application/json: {schema: {type: object}}}}, responses: {"200": {description: Local mini-program card created}, "409": {$ref: "#/components/responses/Error"}}}
  /api/admin/miniprogram-library/{id}:
    get: {operationId: getMediaMiniProgram, security: [{adminSession: []}], parameters: [{$ref: "#/components/parameters/ID"}], responses: {"200": {description: Local mini-program card}}}
    put: {operationId: updateMediaMiniProgram, security: [{adminSession: [], csrfHeader: []}], parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/IdempotencyKey"}], responses: {"200": {description: Local mini-program card updated}}}
    delete: {operationId: deleteMediaMiniProgram, security: [{adminSession: [], csrfHeader: []}], parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/IdempotencyKey"}], responses: {"200": {description: Local mini-program card deleted}, "409": {$ref: "#/components/responses/Error"}}}
  /api/admin/miniprogram-library/{id}/test-resolve:
    post: {operationId: resolveLocalMiniProgramThumbnail, security: [{adminSession: [], csrfHeader: []}], parameters: [{$ref: "#/components/parameters/ID"}], responses: {"200": {description: Local card projection refreshed without Provider call}}}
  /api/admin/group-invite-library:
    get: {operationId: listMediaGroupInvites, security: [{adminSession: []}], responses: {"200": {description: Local group invite cards}}}
    post: {operationId: createMediaGroupInvite, security: [{adminSession: [], csrfHeader: []}], parameters: [{$ref: "#/components/parameters/IdempotencyKey"}], requestBody: {required: true, content: {application/json: {schema: {type: object}}}}, responses: {"200": {description: Local group invite card created}, "409": {$ref: "#/components/responses/Error"}}}
  /api/admin/group-invite-library/{id}:
    get: {operationId: getMediaGroupInvite, security: [{adminSession: []}], parameters: [{$ref: "#/components/parameters/ID"}], responses: {"200": {description: Active local group invite card}, "404": {$ref: "#/components/responses/Error"}}}
    put: {operationId: updateMediaGroupInvite, security: [{adminSession: [], csrfHeader: []}], parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/IdempotencyKey"}], responses: {"200": {description: Local group invite updated}, "409": {$ref: "#/components/responses/Error"}}}
    delete: {operationId: archiveMediaGroupInvite, security: [{adminSession: [], csrfHeader: []}], parameters: [{$ref: "#/components/parameters/ID"}, {$ref: "#/components/parameters/IdempotencyKey"}], responses: {"200": {description: Local group invite archived without Provider call}, "409": {$ref: "#/components/responses/Error"}}}
  /api/admin/access/users:
    get:
      operationId: listAdminUsers
      security: [{adminSession: []}]
      responses:
        "200": {description: Employee list, content: {application/json: {schema: {type: object, required: [ok, users], properties: {ok: {const: true}, users: {type: array, items: {$ref: "#/components/schemas/AdminUser"}}}}}}}
        "403": {$ref: "#/components/responses/Error"}
    post:
      operationId: createAdminUser
      security: [{adminSession: [], csrfHeader: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CreateAdminUser"}}}}
      responses:
        "201": {description: Employee created, content: {application/json: {schema: {$ref: "#/components/schemas/AdminUser"}}}}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/admin/access/users/{id}/disable:
    post:
      operationId: disableAdminUser
      security: [{adminSession: [], csrfHeader: []}]
      parameters: [{$ref: "#/components/parameters/ID"}]
      responses: {"200": {$ref: "#/components/responses/MutationOK"}, "403": {$ref: "#/components/responses/Error"}}
  /api/admin/access/users/{id}/wecom-userid:
    post:
      operationId: bindAdminUserWeComID
      security: [{adminSession: [], csrfHeader: []}]
      parameters: [{$ref: "#/components/parameters/ID"}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [wecom_userid], properties: {wecom_userid: {type: string, maxLength: 128}}}}}}
      responses: {"200": {$ref: "#/components/responses/MutationOK"}, "403": {$ref: "#/components/responses/Error"}}
  /api/admin/access/users/{id}/roles:
    post:
      operationId: changeAdminUserRoles
      security: [{adminSession: [], csrfHeader: []}]
      parameters: [{$ref: "#/components/parameters/ID"}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [roles], properties: {roles: {$ref: "#/components/schemas/Roles"}}}}}}
      responses: {"200": {$ref: "#/components/responses/MutationOK"}, "403": {$ref: "#/components/responses/Error"}}
  /api/admin/access/users/{id}/password:
    post:
      operationId: resetAdminUserPassword
      security: [{adminSession: [], csrfHeader: []}]
      parameters: [{$ref: "#/components/parameters/ID"}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [password], properties: {password: {type: string, minLength: 12, maxLength: 1024, writeOnly: true}}}}}}
      responses: {"200": {$ref: "#/components/responses/MutationOK"}, "403": {$ref: "#/components/responses/Error"}}
  /api/admin/oneid/resolve:
    post:
      operationId: resolveOneID
      description: Read-only lookup. Never provisions and does not accept assurance.
      security: [{adminSession: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/IdentityReference"}}}}
      responses:
        "200": {description: Resolution result, content: {application/json: {schema: {$ref: "#/components/schemas/ResolveResult"}}}}
        "400": {$ref: "#/components/responses/Error"}
  /api/admin/oneid/customers/{customer_id}:
    get:
      operationId: getOneIDCustomer
      security: [{adminSession: []}]
      parameters: [{$ref: "#/components/parameters/CustomerID"}]
      responses:
        "200": {description: Customer identity summary without values or evidence, content: {application/json: {schema: {$ref: "#/components/schemas/CustomerDetail"}}}}
        "404": {$ref: "#/components/responses/Error"}
  /api/admin/oneid/conflicts:
    get:
      operationId: listOneIDConflicts
      security: [{adminSession: []}]
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [open, resolved, ignored], default: open}}
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/Offset"}
      responses:
        "200": {description: Conflict page, content: {application/json: {schema: {$ref: "#/components/schemas/ConflictPage"}}}}
  /api/admin/oneid/merge-candidates:
    get:
      operationId: listOneIDMergeCandidates
      security: [{adminSession: []}]
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [open, confirmed, rejected], default: open}}
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/Offset"}
      responses:
        "200": {description: Candidate page, content: {application/json: {schema: {$ref: "#/components/schemas/MergeCandidatePage"}}}}
  /api/admin/oneid/merge-candidates/{id}/confirm:
    post:
      operationId: confirmOneIDMerge
      security: [{adminSession: [], csrfHeader: []}]
      parameters: [{$ref: "#/components/parameters/ID"}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [survivor_customer_id], properties: {survivor_customer_id: {$ref: "#/components/schemas/PositiveID"}}}}}}
      responses: {"200": {description: Merge confirmed}, "409": {$ref: "#/components/responses/Error"}}
  /api/admin/oneid/merges/{id}/reverse:
    post:
      operationId: reverseOneIDMerge
      security: [{adminSession: [], csrfHeader: []}]
      parameters: [{$ref: "#/components/parameters/ID"}]
      responses: {"200": {description: Merge reversed}, "409": {$ref: "#/components/responses/Error"}}
  /api/admin/external-effects:
    get:
      operationId: listExternalEffects
      description: Digest-only local external-effect projection. It never proves provider delivery.
      security: [{adminSession: []}]
      parameters: [{$ref: "#/components/parameters/Limit"}]
      responses: {"200": {description: Effect list}, "403": {$ref: "#/components/responses/Error"}}
  /api/admin/external-effects/diagnostics:
    get:
      operationId: getExternalEffectDiagnostics
      security: [{adminSession: []}]
      responses: {"200": {description: Local state counts}, "403": {$ref: "#/components/responses/Error"}}
  /api/admin/external-effects/jobs:
    get:
      operationId: listExternalEffectJobs
      description: River-linked local job projection only; it never asserts provider delivery.
      security: [{adminSession: []}]
      responses:
        "200": {description: Local external-effect jobs, content: {application/json: {schema: {$ref: "#/components/schemas/ExternalEffectJobsEnvelope"}}}}
        "403": {$ref: "#/components/responses/Error"}
  /api/admin/external-effects/{id}:
    get:
      operationId: getExternalEffect
      security: [{adminSession: []}]
      parameters: [{$ref: "#/components/parameters/ExternalEffectID"}]
      responses:
        "200": {description: Digest-only external-effect projection, content: {application/json: {schema: {$ref: "#/components/schemas/ExternalEffectProjection"}}}}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/admin/external-effects/{id}/cancel:
    post:
      operationId: cancelExternalEffect
      description: Cancels only before a provider attempt begins.
      security: [{adminSession: [], csrfHeader: []}]
      parameters: [{$ref: "#/components/parameters/ExternalEffectID"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      responses: {"200": {description: Local cancellation projection, content: {application/json: {schema: {$ref: "#/components/schemas/ExternalEffectProjection"}}}}, "400": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}}
  /api/admin/external-effects/{id}/retry:
    post:
      operationId: retryExternalEffect
      description: Retries only retryable_failed. outcome_unknown requires reconciliation.
      security: [{adminSession: [], csrfHeader: []}]
      parameters: [{$ref: "#/components/parameters/ExternalEffectID"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      responses: {"200": {description: Requeued local effect projection, content: {application/json: {schema: {$ref: "#/components/schemas/ExternalEffectProjection"}}}}, "400": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}}
  /api/admin/external-effects/{id}/reconcile:
    post:
      operationId: reconcileExternalEffect
      description: Records digest-only manual evidence for outcome_unknown; it never replays a provider call.
      security: [{adminSession: [], csrfHeader: []}]
      parameters: [{$ref: "#/components/parameters/ExternalEffectID"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [evidence_digest], properties: {evidence_digest: {$ref: "#/components/schemas/Digest"}}}}}}
      responses: {"200": {description: Reconciled local effect projection, content: {application/json: {schema: {$ref: "#/components/schemas/ExternalEffectProjection"}}}}, "400": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}}
  /api/admin/push-center/sections:
    get:
      operationId: getPushCenterSections
      security: [{adminSession: []}]
      responses: {"200": {description: Local Push Center section counts}}
  /api/admin/push-center/stats:
    get:
      operationId: getPushCenterStats
      security: [{adminSession: []}]
      responses: {"200": {description: Local Push Center state statistics}}
  /api/admin/push-center/jobs:
    get:
      operationId: listPushCenterJobs
      security: [{adminSession: []}]
      responses: {"200": {description: River-linked local Push Center jobs, content: {application/json: {schema: {$ref: "#/components/schemas/PushJobsEnvelope"}}}}, "403": {$ref: "#/components/responses/Error"}}
  /api/admin/push-center/jobs/{job_id}:
    get:
      operationId: getPushCenterJob
      security: [{adminSession: []}]
      parameters: [{$ref: "#/components/parameters/PushJobID"}]
      responses:
        "200": {description: Local Push Center job, content: {application/json: {schema: {$ref: "#/components/schemas/PushJobDetailEnvelope"}}}}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/admin/push-center/jobs/{job_id}/reconciliation:
    get:
      operationId: getPushCenterJobReconciliation
      security: [{adminSession: []}]
      parameters: [{$ref: "#/components/parameters/PushJobID"}]
      responses:
        "200": {description: Attempts and local control receipts for one job, content: {application/json: {schema: {$ref: "#/components/schemas/PushReconciliationEnvelope"}}}}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/admin/push-center/jobs/{job_id}/cancel:
    post:
      operationId: cancelPushCenterJob
      security: [{adminSession: [], csrfHeader: []}]
      parameters: [{$ref: "#/components/parameters/PushJobID"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      responses:
        "200": {description: Local push cancellation control receipt, content: {application/json: {schema: {$ref: "#/components/schemas/PushControlEnvelope"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/admin/push-center/jobs/{job_id}/retry:
    post:
      operationId: retryPushCenterJob
      description: Only retryable_failed may be requeued. outcome_unknown must be reconciled first.
      security: [{adminSession: [], csrfHeader: []}]
      parameters: [{$ref: "#/components/parameters/PushJobID"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      responses:
        "200": {description: Local push retry control receipt, content: {application/json: {schema: {$ref: "#/components/schemas/PushControlEnvelope"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/admin/wecom/callback-receipts:
    get:
      operationId: listWeComCallbackReceipts
      description: Safe callback processing projection; excludes raw XML and external identifiers.
      security: [{adminSession: []}]
      parameters: [{$ref: "#/components/parameters/BeforeID"}, {$ref: "#/components/parameters/Limit"}]
      responses:
        "200": {description: Callback receipt page, content: {application/json: {schema: {$ref: "#/components/schemas/CallbackReceiptPage"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /api/admin/wecom/callback-receipts/{receipt_id}:
    get:
      operationId: getWeComCallbackReceipt
      security: [{adminSession: []}]
      parameters: [{$ref: "#/components/parameters/ReceiptID"}]
      responses:
        "200": {description: Safe callback receipt, content: {application/json: {schema: {$ref: "#/components/schemas/CallbackReceipt"}}}}
        "404": {$ref: "#/components/responses/Error"}
  /api/admin/wecom/callback-receipts/{receipt_id}/retry:
    post:
      operationId: retryWeComCallbackReceipt
      description: SuperAdmin-only exact-CAS retry; appends an immutable retry receipt atomically.
      security: [{adminSession: [], csrfHeader: []}]
      parameters: [{$ref: "#/components/parameters/ReceiptID"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CallbackRetryRequest"}}}}
      responses:
        "200": {description: Retry receipt, content: {application/json: {schema: {$ref: "#/components/schemas/CallbackRetryResponse"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/admin/channel-acquisition-entrant-receipts/unassigned:
    get:
      operationId: listUnassignedChannelEntrantReceipts
      description: Lists unmatched, ambiguous, and OneID-conflict entrant facts without external identifiers or raw State.
      security: [{adminSession: []}]
      parameters: [{$ref: "#/components/parameters/BeforeID"}, {$ref: "#/components/parameters/Limit"}]
      responses:
        "200": {description: Unassigned entrant page, content: {application/json: {schema: {$ref: "#/components/schemas/EntrantReceiptPage"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /api/admin/channel-acquisition-entrant-receipts/{receipt_id}/reconcile:
    post:
      operationId: reconcileChannelEntrantReceipt
      description: Reconciles only unmatched or ambiguous channel attribution. Identity conflicts must use OneID conflict handling.
      security: [{adminSession: [], csrfHeader: []}]
      parameters: [{$ref: "#/components/parameters/ReceiptID"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/EntrantReconcileRequest"}}}}
      responses:
        "200": {description: Reconciled entrant receipt, content: {application/json: {schema: {$ref: "#/components/schemas/EntrantReconcileResponse"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /wecom/external-contact/callback:
    get:
      operationId: verifyWeComCallback
      parameters:
        - {$ref: "#/components/parameters/MessageSignature"}
        - {$ref: "#/components/parameters/Timestamp"}
        - {$ref: "#/components/parameters/Nonce"}
        - {name: echostr, in: query, required: true, schema: {type: string}}
      responses: {"200": {description: Decrypted echo, content: {text/plain: {schema: {type: string}}}}, "403": {$ref: "#/components/responses/Error"}}
    post:
      operationId: ingestWeComExternalContactCallback
      parameters:
        - {$ref: "#/components/parameters/MessageSignature"}
        - {$ref: "#/components/parameters/Timestamp"}
        - {$ref: "#/components/parameters/Nonce"}
      requestBody: {required: true, content: {application/xml: {schema: {type: string, maxLength: 1048576}}}}
      responses:
        "200": {description: Authenticated callback durably accepted; body is a separately signed WeCom encrypted XML acknowledgement that decrypts to success, content: {application/xml: {schema: {type: string}}}}
        "400": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /api/wecom/events:
    get:
      operationId: verifyWeComCallbackCompatibilityAlias
      description: Compatibility alias with identical cryptographic and persistence behavior.
      parameters:
        - {$ref: "#/components/parameters/MessageSignature"}
        - {$ref: "#/components/parameters/Timestamp"}
        - {$ref: "#/components/parameters/Nonce"}
        - {name: echostr, in: query, required: true, schema: {type: string}}
      responses: {"200": {description: Decrypted echo, content: {text/plain: {schema: {type: string}}}}, "403": {$ref: "#/components/responses/Error"}}
    post:
      operationId: ingestWeComExternalContactCallbackCompatibilityAlias
      description: Compatibility alias with identical encrypted ACK and durable Inbox behavior.
      parameters:
        - {$ref: "#/components/parameters/MessageSignature"}
        - {$ref: "#/components/parameters/Timestamp"}
        - {$ref: "#/components/parameters/Nonce"}
      requestBody: {required: true, content: {application/xml: {schema: {type: string, maxLength: 1048576}}}}
      responses:
        "200": {description: WeCom encrypted XML acknowledgement, content: {application/xml: {schema: {type: string}}}}
        "400": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /sidebar/bind-mobile:
    get:
      operationId: sidebarPage
      responses: {"200": {description: WeCom sidebar HTML shell, content: {text/html: {schema: {type: string}}}}}
  /api/sidebar/oauth/start:
    get:
      operationId: startSidebarOAuth
      parameters: [{$ref: "#/components/parameters/SafeNext"}]
      responses: {"302": {description: Redirect to WeCom OAuth}, "503": {$ref: "#/components/responses/Unavailable"}}
  /api/sidebar/oauth/callback:
    get:
      operationId: completeSidebarOAuth
      parameters:
        - {name: state, in: query, required: true, schema: {type: string}}
        - {name: code, in: query, required: true, schema: {type: string}}
      responses: {"302": {description: Independent Secure sidebar session issued}, "400": {$ref: "#/components/responses/Error"}}
  /api/sidebar/jssdk-config:
    get:
      operationId: getSidebarJSSDKConfig
      security: [{sidebarSession: []}]
      parameters: [{name: url, in: query, required: true, schema: {type: string, format: uri}}]
      responses:
        "200": {description: Regular and agent JSSDK signatures, content: {application/json: {schema: {$ref: "#/components/schemas/JSSDKConfig"}}}}
        "401": {$ref: "#/components/responses/Error"}
  /api/sidebar/context-token:
    post:
      operationId: issueSidebarContextToken
      security: [{sidebarSession: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [external_userid], properties: {external_userid: {type: string, minLength: 1, maxLength: 1024}}}}}}
      responses:
        "200": {description: Short-lived employee/customer/corporation token, content: {application/json: {schema: {type: object, required: [context_token], properties: {context_token: {type: string, writeOnly: true}}}}}}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/sidebar/v2/workbench:
    get:
      operationId: getSidebarWorkbench
      security: [{contextToken: []}]
      responses:
        "200": {description: Minimal OneID workbench, content: {application/json: {schema: {type: object, required: [customer_id, status], properties: {customer_id: {$ref: "#/components/schemas/PositiveID"}, status: {type: string, enum: [active, merged, closed]}}}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
components:
  securitySchemes:
    adminSession: {type: apiKey, in: cookie, name: aicrm_admin_session}
    sidebarSession: {type: apiKey, in: cookie, name: aicrm_sidebar_session}
    csrfHeader: {type: apiKey, in: header, name: X-CSRF-Token}
    contextToken: {type: http, scheme: bearer}
  parameters:
    ID: {name: id, in: path, required: true, schema: {$ref: "#/components/schemas/PositiveID"}}
    ExternalEffectID: {name: id, in: path, required: true, schema: {$ref: "#/components/schemas/ExternalEffectID"}}
    PushJobID: {name: job_id, in: path, required: true, schema: {$ref: "#/components/schemas/PositiveID"}}
    ExternalEffectsView: {name: view, in: query, required: true, schema: {type: string, const: external-effects}}
    PushJobQuery: {name: job, in: query, schema: {$ref: "#/components/schemas/PositiveID"}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: false, description: Explicit keys replay or reject payload drift. Frozen v2 Media controls omit this header; the compatibility adapter mints and audits a fresh per-request key., schema: {type: string, minLength: 1, maxLength: 200}}
    CustomerID: {name: customer_id, in: path, required: true, schema: {$ref: "#/components/schemas/PositiveID"}}
    SafeNext: {name: next, in: query, schema: {type: string, pattern: "^/"}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
    Offset: {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
    BeforeID: {name: before_id, in: query, schema: {type: integer, format: int64, minimum: 1}}
    ReceiptID: {name: receipt_id, in: path, required: true, schema: {$ref: "#/components/schemas/PositiveID"}}
    MessageSignature: {name: msg_signature, in: query, required: true, schema: {type: string}}
    Timestamp: {name: timestamp, in: query, required: true, schema: {type: string, pattern: "^[0-9]+$"}}
    Nonce: {name: nonce, in: query, required: true, schema: {type: string}}
  responses:
    Error: {description: Stable error response, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
    Unavailable: {description: Dependency or provider unavailable, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
    MutationOK: {description: Mutation completed, content: {application/json: {schema: {type: object, required: [ok], properties: {ok: {const: true}}}}}}
  schemas:
    PositiveID: {type: integer, format: int64, minimum: 1}
    MediaAttachmentUploadInitiateRequest:
      type: object
      additionalProperties: false
      required: [file_name, name, size, sha256]
      properties:
        file_name: {type: string, minLength: 1, maxLength: 255}
        name: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 10000}
        size: {type: integer, minimum: 1, maximum: 10485760}
        sha256: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        enabled: {type: boolean}
    MediaAttachmentUploadPartRequest:
      type: object
      additionalProperties: false
      required: [sha256, content]
      properties:
        sha256: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        content: {type: string, minLength: 1, contentEncoding: base64}
    ExternalEffectID: {type: string, pattern: '^eer_[1-9][0-9]*$', example: eer_1}
    Digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
    ExternalEffectState: {type: string, enum: [accepted, queued, attempted, executed, outcome_unknown, reconciled, retryable_failed, final_failed, cancelled]}
    ExternalEffectProjection:
      type: object
      required: [id, owner, kind, state, attempt_count, generation, updated_at]
      properties:
        id: {$ref: "#/components/schemas/ExternalEffectID"}
        owner: {type: string, const: outbound}
        kind: {type: string, enum: [outbound_message, outbound_media, wecom_tag_catalog, group_message]}
        state: {$ref: "#/components/schemas/ExternalEffectState"}
        attempt_count: {type: integer, minimum: 0}
        generation: {type: integer, format: int64, minimum: 1}
        updated_at: {type: string, format: date-time}
    ExternalEffectJobsEnvelope:
      type: object
      required: [ok, local_fact_only, real_external_call_executed, delivery_proven, provider_execution_eligible, items]
      properties:
        ok: {const: true}
        local_fact_only: {const: true}
        real_external_call_executed: {const: false}
        delivery_proven: {const: false}
        provider_execution_eligible: {const: false}
        items: {type: array, items: {$ref: "#/components/schemas/ExternalEffectJob"}}
    ExternalEffectJob:
      type: object
      required: [id, status, classification, attempt_count, created_at, status_updated_at]
      properties:
        id: {type: string, pattern: '^eerj_[1-9][0-9]*$'}
        status: {$ref: "#/components/schemas/ExternalEffectState"}
        classification: {type: string, enum: [local, manual_review]}
        attempt_count: {type: integer, minimum: 0}
        created_at: {type: string, format: date-time}
        status_updated_at: {type: string, format: date-time}
    PushJob:
      type: object
      required: [job_id, status, attempt_count, failure_class, created_at, status_updated_at, local_fact_only, real_external_call_executed, delivery_proven, provider_execution_eligible]
      properties:
        job_id: {$ref: "#/components/schemas/PositiveID"}
        status: {type: string, enum: [pending, running, sent, reconciled, failed, outcome_unknown, retryable_failed, cancelled]}
        attempt_count: {type: integer, minimum: 0}
        failure_class: {type: string, enum: [local, manual_review]}
        created_at: {type: string, format: date-time}
        status_updated_at: {type: string, format: date-time}
        local_fact_only: {const: true}
        real_external_call_executed: {const: false}
        delivery_proven: {const: false}
        provider_execution_eligible: {const: false}
    PushJobsEnvelope:
      type: object
      required: [ok, fallback_used, local_fact_only, real_external_call_executed, delivery_proven, provider_execution_eligible, items]
      properties:
        ok: {const: true}
        fallback_used: {const: false}
        local_fact_only: {const: true}
        real_external_call_executed: {const: false}
        delivery_proven: {const: false}
        provider_execution_eligible: {const: false}
        items: {type: array, items: {$ref: "#/components/schemas/PushJob"}}
    PushJobDetailEnvelope:
      type: object
      required: [ok, fallback_used, local_fact_only, real_external_call_executed, delivery_proven, provider_execution_eligible, job]
      properties:
        ok: {const: true}
        fallback_used: {const: false}
        local_fact_only: {const: true}
        real_external_call_executed: {const: false}
        delivery_proven: {const: false}
        provider_execution_eligible: {const: false}
        job: {$ref: "#/components/schemas/PushJob"}
    PushAttempt:
      type: object
      required: [attempt_id, attempt, state, failure_class, local_fact_only, real_external_call_executed, delivery_proven]
      properties:
        attempt_id: {$ref: "#/components/schemas/PositiveID"}
        attempt: {type: integer, minimum: 1}
        state: {$ref: "#/components/schemas/ExternalEffectState"}
        failure_class: {type: string, enum: [local, manual_review]}
        completed_at: {type: [string, "null"], format: date-time}
        dispatch_started_at: {type: string, format: date-time}
        local_fact_only: {const: true}
        real_external_call_executed: {const: false}
        delivery_proven: {const: false}
    PushControlReceipt:
      type: object
      required: [task_id, operation, task_status, completed_at, actor_admin_user_id, local_fact_only, real_external_call_executed, delivery_proven]
      properties:
        task_id: {$ref: "#/components/schemas/PositiveID"}
        operation: {type: string, enum: [accept, queue, retry, cancel, complete, reconcile, manual_retry]}
        task_status: {type: string}
        completed_at: {type: string, format: date-time}
        actor_admin_user_id: {type: [integer, "null"], minimum: 1}
        local_fact_only: {const: true}
        real_external_call_executed: {const: false}
        delivery_proven: {const: false}
    PushReconciliationEnvelope:
      allOf:
        - {$ref: "#/components/schemas/PushJobDetailEnvelope"}
        - type: object
          required: [attempts, control_receipts]
          properties:
            attempts: {type: array, items: {$ref: "#/components/schemas/PushAttempt"}}
            control_receipts: {type: array, items: {$ref: "#/components/schemas/PushControlReceipt"}}
    PushControlEnvelope:
      type: object
      required: [ok, fallback_used, local_fact_only, real_external_call_executed, delivery_proven, provider_execution_eligible, control_receipt]
      properties:
        ok: {const: true}
        fallback_used: {const: false}
        local_fact_only: {const: true}
        real_external_call_executed: {const: false}
        delivery_proven: {const: false}
        provider_execution_eligible: {const: false}
        control_receipt: {$ref: "#/components/schemas/PushControlReceipt"}
    StatusResponse:
      type: object
      additionalProperties: false
      required: [status, release_sha]
      properties: {status: {type: string}, release_sha: {type: string}}
    ErrorResponse:
      type: object
      properties: {ok: {type: boolean, const: false}, error: {type: string}, code: {type: string}}
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password, login_csrf_token]
      properties: {username: {type: string, minLength: 3, maxLength: 120}, password: {type: string, minLength: 12, maxLength: 1024, writeOnly: true}, login_csrf_token: {type: string, minLength: 32, writeOnly: true}, next: {type: string}}
    LoginResponse:
      type: object
      required: [ok, next, csrf_token]
      properties: {ok: {const: true}, next: {type: string}, csrf_token: {type: string, writeOnly: true}}
    Roles: {type: array, minItems: 1, uniqueItems: true, items: {type: string, enum: [super_admin, admin, viewer]}}
    AdminUser:
      type: object
      required: [id, username, display_name, wecom_userid, active, roles]
      properties:
        id: {$ref: "#/components/schemas/PositiveID"}
        username: {type: string}
        display_name: {type: string}
        wecom_userid: {type: string}
        active: {type: boolean}
        roles: {$ref: "#/components/schemas/Roles"}
        last_login_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    CreateAdminUser:
      type: object
      additionalProperties: false
      required: [username, password, display_name, roles]
      properties: {username: {type: string, minLength: 3, maxLength: 120}, password: {type: string, minLength: 12, maxLength: 1024, writeOnly: true}, display_name: {type: string, minLength: 1, maxLength: 120}, roles: {$ref: "#/components/schemas/Roles"}}
    IdentityReference:
      type: object
      additionalProperties: false
      required: [kind, scope, value]
      properties: {kind: {type: string}, scope: {type: string}, value: {type: string}}
    ResolveResult:
      type: object
      required: [status]
      properties: {status: {type: string, enum: [found, not_found, conflict]}, customer_id: {$ref: "#/components/schemas/PositiveID"}, identity_id: {$ref: "#/components/schemas/PositiveID"}}
    IdentitySummary: {type: object, additionalProperties: false, required: [kind, scope], properties: {kind: {type: string}, scope: {type: string}}}
    MergeLineage:
      type: object
      required: [id, from_customer_id, to_customer_id, reversible_status, merged_at]
      properties: {id: {$ref: "#/components/schemas/PositiveID"}, from_customer_id: {$ref: "#/components/schemas/PositiveID"}, to_customer_id: {$ref: "#/components/schemas/PositiveID"}, reversible_status: {type: string}, merged_at: {type: string, format: date-time}, reversed_at: {type: [string, "null"], format: date-time}}
    CustomerDetail:
      type: object
      required: [customer_id, status, canonical_customer_id, canonical_status, identities, merge_lineage]
      properties: {customer_id: {$ref: "#/components/schemas/PositiveID"}, status: {type: string}, canonical_customer_id: {$ref: "#/components/schemas/PositiveID"}, canonical_status: {type: string}, identities: {type: array, items: {$ref: "#/components/schemas/IdentitySummary"}}, merge_lineage: {type: array, items: {$ref: "#/components/schemas/MergeLineage"}}}
    ConflictPage:
      type: object
      required: [items, limit, offset]
      properties: {items: {type: array, items: {$ref: "#/components/schemas/Conflict"}}, limit: {type: integer}, offset: {type: integer}}
    Conflict:
      type: object
      required: [id, left_customer_id, right_customer_id, reason, status, created_at]
      properties: {id: {$ref: "#/components/schemas/PositiveID"}, left_customer_id: {$ref: "#/components/schemas/PositiveID"}, right_customer_id: {$ref: "#/components/schemas/PositiveID"}, reason: {type: string}, status: {type: string}, created_at: {type: string, format: date-time}, resolved_at: {type: [string, "null"], format: date-time}}
    MergeCandidatePage:
      type: object
      required: [items, limit, offset]
      properties: {items: {type: array, items: {$ref: "#/components/schemas/MergeCandidate"}}, limit: {type: integer}, offset: {type: integer}}
    MergeCandidate:
      type: object
      required: [id, left_customer_id, right_customer_id, evidence_strength, reason, status, created_at]
      properties: {id: {$ref: "#/components/schemas/PositiveID"}, left_customer_id: {$ref: "#/components/schemas/PositiveID"}, right_customer_id: {$ref: "#/components/schemas/PositiveID"}, evidence_strength: {type: string, enum: [strong, medium, weak]}, reason: {type: string}, status: {type: string}, selected_survivor_customer_id: {$ref: "#/components/schemas/PositiveID"}, created_at: {type: string, format: date-time}, resolved_at: {type: [string, "null"], format: date-time}}
    JSSDKSignature:
      type: object
      required: [timestamp, nonceStr, signature, jsApiList]
      properties: {timestamp: {type: integer, format: int64}, nonceStr: {type: string}, signature: {type: string}, jsApiList: {type: array, items: {type: string}}}
    JSSDKConfig:
      type: object
      required: [corp_id, agent_id, config, agent_config]
      properties: {corp_id: {type: string}, agent_id: {type: string}, config: {$ref: "#/components/schemas/JSSDKSignature"}, agent_config: {$ref: "#/components/schemas/JSSDKSignature"}}
    CallbackReceipt:
      type: object
      additionalProperties: false
      required: [id, inbox_id, kind, attempt_number, prior_inbox_status, resulting_inbox_status, result_codes, created_at]
      properties:
        id: {$ref: "#/components/schemas/PositiveID"}
        inbox_id: {$ref: "#/components/schemas/PositiveID"}
        kind: {type: string, enum: [processing, retry_requested]}
        target_receipt_id: {$ref: "#/components/schemas/PositiveID"}
        attempt_number: {type: integer, minimum: 1}
        event_type: {type: string}
        change_type: {type: string}
        prior_inbox_status: {type: string, enum: [received, processing, processed, retryable, failed]}
        resulting_inbox_status: {type: string, enum: [received, processing, processed, retryable, failed]}
        result_codes: {type: array, maxItems: 4, items: {type: string, enum: [customer_created, customer_resolved, relationship_activated, relationship_deactivated, channel_attributed, channel_unmatched, channel_ambiguous, identity_conflict, ignored, failed_terminal]}}
        error_code: {type: string}
        created_at: {type: string, format: date-time}
    CallbackReceiptPage:
      type: object
      additionalProperties: false
      required: [items]
      properties: {items: {type: array, items: {$ref: "#/components/schemas/CallbackReceipt"}}}
    CallbackRetryRequest:
      type: object
      additionalProperties: false
      required: [expected_status, expected_attempt, reason]
      properties:
        expected_status: {type: string, enum: [retryable, failed]}
        expected_attempt: {type: integer, minimum: 1}
        reason: {type: string, minLength: 1, maxLength: 500}
    CallbackRetryResponse:
      type: object
      additionalProperties: false
      required: [receipt, replayed]
      properties: {receipt: {$ref: "#/components/schemas/CallbackReceipt"}, replayed: {type: boolean}}
    EntrantReceipt:
      type: object
      additionalProperties: false
      required: [id, inbox_id, change_type, status, prior_status, occurred_at, created_at]
      properties:
        id: {$ref: "#/components/schemas/PositiveID"}
        inbox_id: {$ref: "#/components/schemas/PositiveID"}
