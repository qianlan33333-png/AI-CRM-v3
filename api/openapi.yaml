      responses: {"200": {description: Original-key reconciliation result, content: {application/json: {schema: {$ref: "#/components/schemas/AIAssistantReconcileResponse"}}}}, "400": {$ref: "#/components/responses/Error"}, "401": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}}
